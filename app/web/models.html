<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>执行体与价格 · ZK-AI</title>
<style>
  @import url("/ui/tokens.css");

  /* 本页只留组件样式；色板 / 字阶 / 圆角全部来自 tokens.css。 */

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
          "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header .logo {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 16px;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border-strong); background: var(--panel);
    color: var(--text); border-radius: var(--radius-sm);
    padding: 6px 12px; font: inherit; cursor: pointer; text-decoration: none;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  main { padding: 18px 20px 40px; max-width: 1100px; width: 100%; margin: 0 auto; }
  .summary {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px;
  }
  .summary h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .summary .line { color: var(--text-2); font-size: 12px; }
  .summary .line + .line { margin-top: 3px; }
  section.group { margin-bottom: 22px; }
  .group-head {
    display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px;
  }
  .group-head h3 { margin: 0; font-size: 13px; font-weight: 700; }
  .group-head .desc { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 12px; vertical-align: top; }
  th { background: var(--panel-2); font-weight: 600; color: var(--text-2); }
  tr:last-child td { border-bottom: none; }
  td.name { font-weight: 600; word-break: break-all; }
  td.name .sub { display: block; font-weight: 400; }
  .pill {
    display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .pill.ok { color: var(--ok); background: var(--ok-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.err { color: var(--err); background: var(--err-soft); }
  .pill.muted { color: var(--muted); background: var(--panel-2); }
  .muted { color: var(--muted); font-size: 12px; }
  .empty {
    background: var(--panel); border: 1px dashed var(--border-strong);
    border-radius: var(--radius); padding: 32px; text-align: center;
    color: var(--muted);
  }
  .empty.error { color: var(--err); background: var(--err-soft); }
  details.raw { margin-top: 10px; }
  details.raw pre { max-height: 320px; overflow: auto; font-size: 11px; }
</style>
</head>
<body>
<header>
  <div class="logo">💲</div>
  <div>
    <h1>执行体与价格</h1>
    <div class="sub">外部 CLI 执行体能调哪些模型、实测什么价。网关自己的模型牌价在控制台「模型」页。</div>
  </div>
  <div class="spacer"></div>
  <button class="btn" onclick="load()">刷新</button>
  <a class="btn" href="/ui?view=pricing">返回控制台</a>
</header>
<main>
  <section class="summary">
    <h2>总览</h2>
    <div id="summary" class="line muted">正在读取…</div>
  </section>
  <div id="body"><div class="empty">正在读取…</div></div>
</main>
<script src="/ui/common.js"></script>
<script>
// 主题跟控制台走（父文档 data-theme → 本机存储 → 系统偏好）。
// common.js 在这里加载，主题必须在首次绘制前写上 <html>，否则暗色下闪白。
var themeApplied = (document.documentElement.dataset.theme = ZKUI.theme());
/* HTML 转义走共享外壳（2026-11-10）。原来这页有一份自己的实现，
   和 taskspaces.html 逐字相同——同一个网关四份转义规则是 XSS 面。 */
var esc = ZKUI.esc;

/* 令牌与请求走共享外壳；401 弹登录框（手机直开 /ui/models 的兜底）。 */
async function api(path, options) {
  try {
    return await ZKUI.api(path, options);
  } catch (err) {
    if (err.isAuth) {
      ZKUI.promptLogin("打开模型与价格页需要管理令牌（与网关 .env 里的 ZKAI_ADMIN_TOKEN 相同）");
    }
    throw err;
  }
}

// 价格来源的中文说法：来源不明就说来源不明，不含糊
const SOURCE_LABEL = {
  tariff: ["牌价", "ok"],
  observed: ["实测", "warn"],
  subscription: ["订阅内", "muted"],
  unknown: ["未知", "muted"],
};

function sourcePill(source) {
  const pair = SOURCE_LABEL[source] || SOURCE_LABEL.unknown;
  return '<span class="pill ' + pair[1] + '">' + pair[0] + "</span>";
}

function money(value) {
  if (value == null) return "—";
  const num = Number(value);
  if (!Number.isFinite(num)) return "—";
  if (num === 0) return "0（不额外计费）";
  return "$" + num.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
}

function priceCell(row) {
  if (row.price_source === "tariff") {
    const prices = Array.isArray(row.prices) ? row.prices : [];
    if (!prices.length) return '<span class="muted">配置里没有部署</span>';
    return prices.map(function (p) {
      const flag = p.enabled === false ? ' <span class="pill muted">已停用</span>' : "";
      return '<div>' + esc(p.provider || "未知供应商")
        + "：入 " + money(p.input_per_mtok)
        + " / 出 " + money(p.output_per_mtok)
        + " <span class=\"muted\">每百万 token</span>" + flag + "</div>";
    }).join("");
  }
  if (row.price_source === "observed") {
    const seen = row.observed || {};
    const avg = money(seen.avg_cost_usd);
    return '<div>实测均价 ' + avg + " / 次</div>"
      + '<div class="muted">共 ' + esc(seen.calls) + " 次调用，其中 "
      + esc(seen.costed_calls) + " 次拿到自报成本</div>";
  }
  return '<span class="muted">' + esc(row.price_note || "没有价格数据") + "</span>";
}

/* 兑换率渲染：credits 是「一次对话扣多少积分倍率」，x0.29 表示按 0.29 倍计费。
   来源是 WorkBuddy/CodeBuddy 桌面端缓存（唯一带价格的权威源）；
   CLI 的 --help / --list-models 都不带价格，所以那边 rate 是 null，
   如实显示「兑换率未知」而不是编一个「免费」。 */
function ratePill(rate) {
  if (rate === null || rate === undefined) return "";
  if (rate === 0) return ' <span class="pill ok">免费</span>';
  const tone = rate <= 0.2 ? "ok" : rate <= 0.6 ? "" : "warn";
  return ' <span class="pill ' + tone + '">×' + Number(rate).toFixed(2) + "</span>";
}

function modelMeta(model) {
  const bits = [];
  if (model.tools === true) bits.push("工具");
  if (model.images === true) bits.push("图片");
  if (model.max_input_tokens) bits.push(Math.round(model.max_input_tokens / 1000) + "K 上下文");
  if (model.tools === null || model.tools === undefined) bits.push("属性未知（CLI 不提供）");
  return bits.join(" · ");
}

/* 清单来源标签。三种口径的差别见 docs/模型市场与预设.md：
   probed = 真发请求验证过（唯一可信）；live = CLI 自己报的名字（可能是静态帮助文字）；
   config = 配置文件快照（最弱，只作兜底）。 */
function sourceBadge(src) {
  if (src === "probed") return '<span class="pill ok">实测可用</span>';
  if (src === "live") return '<span class="pill muted">CLI 自报（未实测）</span>';
  return '<span class="pill muted">配置快照（未实测）</span>';
}

function executorTable(rows) {
  const body = rows.map(function (row) {
    const models = Array.isArray(row.models) ? row.models : [];
    const lines = models.length
      ? models.map(function (model) {
          const meta = modelMeta(model);
          return '<div style="margin-bottom:4px">'
            + "<b>" + esc(model.id) + "</b>" + ratePill(model.rate)
            + (model.free && (model.rate === null || model.rate === undefined)
                ? ' <span class="pill muted">配置标为免费</span>' : "")
            + (meta ? '<div class="muted">' + esc(meta) + "</div>" : "")
            + "</div>";
        }).join("")
      : '<span class="muted">这个工具没有可列出的模型</span>';
    return "<tr>"
      + '<td class="name">' + esc(row.tool)
      + '<span class="sub muted">' + esc(row.role || "无角色") + "</span></td>"
      + "<td>" + lines + "</td>"
      + "<td>" + esc(row.cost_tier || "—") + "</td>"
      + '<td>' + sourceBadge(row.models_source) + "</td>"
      + "</tr>";
  }).join("");
  return "<table><thead><tr><th scope='col'>工具</th><th scope='col'>模型与兑换率</th><th scope='col'>档位</th><th scope='col'>清单来源</th></tr></thead>"
    + "<tbody>" + body + "</tbody></table>";
}

async function load() {
  const box = document.getElementById("body");
  const sumBox = document.getElementById("summary");
  box.innerHTML = '<div class="empty">正在读取…</div>';
  try {
    // 先拿缓存版（秒开），再后台让各工具重新报一遍清单。
    const data = await api("/zkadmin/agent/model-inventory");
    render(data);
    // 核实实时清单：起 CLI 要十几秒，不阻塞首屏，回来再刷一次。
    api("/zkadmin/agent/model-inventory?refresh=true")
      .then(function (fresh) {
        if (fresh && fresh.summary) render(fresh);
      })
      .catch(function () { /* 核实失败就继续用缓存版，不打扰用户 */ });
  } catch (err) {
    box.innerHTML = '<div class="empty error">读取失败：' + esc(err.message) + "</div>";
    sumBox.textContent = "读取失败";
  }
}

function render(data) {
  const box = document.getElementById("body");
  const sumBox = document.getElementById("summary");
  const s = data.summary || {};
  // 2026-11-10：这一页收窄为「外部 CLI 执行体」——网关模型的牌价在控制台
  // 「模型」页的模型表里已经有（每条部署后面带 💲输入/输出），此处不再重复
  // 一份。两份表并存的结果是：改了 models.yaml 之后，这边照旧显示旧价，
  // 而运营者不知道该信哪个。
  sumBox.innerHTML =
    "外部 <b>" + esc(s.executor_models) + "</b> 个模型有清单；"
    + "网关模型的牌价请看控制台「模型」页（那边是同一份 models.yaml 的实时值）。"
    + '<div class="muted" style="margin-top:6px">'
    + (data.notes || []).map(esc).join("<br>") + "</div>";

  const executors = Array.isArray(data.executors) ? data.executors : [];
  let html = "";
  if (executors.length) {
    html += '<section class="group"><div class="group-head"><h3>外部 CLI 执行体</h3>'
      + '<span class="desc">清单里的每个模型都真发过一次请求验证可用（'
      + '不是抄帮助文档，也不是桌面缓存的全部条目）；'
      + '兑换率 ×N 是桌面端 credits 倍率，即一次对话的积分倍数</span></div>'
      + executorTable(executors) + "</section>";
  }
  box.innerHTML = html || '<div class="empty">还没有配置任何外部 CLI 执行体。</div>';
}

load();
</script>
</body>
</html>
