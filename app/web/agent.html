<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZK-Agent · 批量任务跑批</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f5; --panel-3: #e9edf2;
    --border: #e3e8ee; --border-strong: #d3dae3;
    --text: #1a2230; --text-2: #4a5666; --muted: #7a8798;
    --accent: #2563eb; --accent-hover: #1d4fd7; --accent-soft: #eff4ff;
    --ok: #15803d; --ok-soft: #ecfdf3; --ok-border: #bbf7d0;
    --warn: #b45309; --warn-soft: #fffbeb; --warn-border: #fde68a;
    --err: #b91c1c; --err-soft: #fef2f2; --err-border: #fecaca;
    --radius: 8px; --radius-sm: 6px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
    --shadow-md: 0 4px 16px rgba(16, 24, 40, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1218; --panel: #161b24; --panel-2: #1d232e; --panel-3: #232b38;
      --border: #2a323f; --border-strong: #3a4453;
      --text: #e7edf4; --text-2: #b8c3d1; --muted: #8794a6;
      --accent: #5b9cff; --accent-hover: #7cb0ff; --accent-soft: rgba(91, 156, 255, .12);
      --ok: #4ade80; --ok-soft: rgba(74, 222, 128, .10); --ok-border: rgba(74, 222, 128, .35);
      --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .10); --warn-border: rgba(251, 191, 36, .35);
      --err: #f87171; --err-soft: rgba(248, 113, 113, .10); --err-border: rgba(248, 113, 113, .35);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .30);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, .40);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
          "Segoe UI", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 700; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
  }
  header .logo {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    background: linear-gradient(135deg, var(--accent), #4f8cff);
    display: grid; place-items: center; font-size: 14px;
    box-shadow: 0 2px 6px rgba(37, 99, 235, .32);
  }
  header .spacer { flex: 1; }
  select, input[type=text], textarea {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 6px 9px; font: inherit;
  }
  select:focus, textarea:focus, input:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    background: var(--panel); color: var(--text-2);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 6px 12px; font: inherit; font-weight: 500;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background .14s, border-color .14s, color .14s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  button.small { padding: 3px 9px; font-size: 12px; }

  .chip {
    display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
  }
  .chip.running { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .chip.waiting_approval { color: var(--warn); border-color: var(--warn-border); background: var(--warn-soft); }
  .chip.done { color: var(--ok); border-color: var(--ok-border); background: var(--ok-soft); }
  .chip.interrupted { color: var(--neutral, #64748b); border-color: var(--border-strong); }
  .chip.failed, .chip.cancelled { color: var(--err); border-color: var(--err-border); background: var(--err-soft); }

  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 268px; flex: none; background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  aside .head {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  aside .head b { flex: 1; font-size: 12px; color: var(--text-2); font-weight: 600; }
  #sessionList { overflow-y: auto; flex: 1; }
  .session {
    padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
    display: flex; flex-direction: column; gap: 4px; position: relative;
    transition: background .14s;
  }
  .session:hover { background: var(--panel-2); }
  .session.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .session .t {
    font-size: 13px; font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; padding-right: 24px;
  }
  .session .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .session .del {
    position: absolute; right: 8px; top: 8px; border: none; background: none;
    color: var(--muted); padding: 2px 5px; display: none; font-size: 12px;
  }
  .session:hover .del { display: block; }
  .session .del:hover { color: var(--err); background: var(--err-soft); }

  section.chat { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #stream {
    flex: 1; overflow-y: auto; padding: 18px 22px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .row { max-width: 880px; width: 100%; margin: 0 auto; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 11px 15px;
    box-shadow: var(--shadow-sm);
  }
  .row.user .card { border-left: 3px solid var(--accent); }
  .row .who {
    font-size: 12px; color: var(--muted); margin-bottom: 6px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .row .who .seq { color: var(--muted); font-variant-numeric: tabular-nums; }
  pre {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 9px 11px; overflow-x: auto;
    font-size: 12.5px; line-height: 1.55; white-space: pre-wrap;
    word-break: break-word; margin: 7px 0 0;
    font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  details { margin-top: 7px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12.5px; user-select: none; }
  .tools-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .toolchip {
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 11.5px;
    padding: 1px 9px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 999px; color: var(--text-2);
  }
  .routing { font-size: 11.5px; color: var(--muted); margin-top: 7px; }
  /* 子任务结论：保留换行与缩进，但长文本不该把卡片撑爆 */
  .spawn-body { white-space: pre-wrap; word-break: break-word; font-size: 13px;
    line-height: 1.55; margin-top: 6px; max-height: 320px; overflow: auto; }
  .linklike { background: none; border: 0; padding: 0; margin-top: 7px; cursor: pointer;
    font-size: 11.5px; color: var(--accent); text-decoration: underline; }
  .linklike:hover { color: var(--accent-strong, var(--accent)); }
  /* ---------- Markdown 渲染（md() 的产物） ----------
     white-space 必须归 normal：外层 .spawn-body 带 pre-wrap，不覆盖的话
     块级元素之间会多出一堆空行。 */
  .md { white-space: normal; word-break: break-word; line-height: 1.65; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 7px 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 13px 0 7px; font-size: 13.5px; font-weight: 700; }
  .md ul, .md ol { margin: 7px 0; padding-left: 21px; }
  .md li { margin: 3px 0; }
  .md code {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 0 4px; font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px;
  }
  .md pre.md-code {
    margin: 9px 0; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 9px 11px; overflow-x: auto;
    font-size: 12.5px; line-height: 1.55; white-space: pre; word-break: normal;
  }
  .md blockquote {
    margin: 8px 0; padding: 3px 11px; border-left: 3px solid var(--border-strong);
    color: var(--text-2);
  }
  /* 表格：宽了横向滚动，不要把卡片撑爆；表头不折行，数字列靠右读着顺 */
  .md table {
    display: block; width: 100%; overflow-x: auto; border-collapse: collapse;
    margin: 9px 0; font-size: 12.5px;
  }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; vertical-align: top; }
  .md th { background: var(--panel-2); font-weight: 700; white-space: nowrap; }
  .md tbody tr:nth-child(even) { background: var(--panel-2); }
  .md a { color: var(--accent); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 11px 0; }
  .approval-actions { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .approval-actions .ok { color: var(--ok); border-color: var(--ok-border); }
  .approval-actions .ok:hover { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  .approval-actions .no { color: var(--err); border-color: var(--err-border); }
  .approval-actions .no:hover { background: var(--err-soft); color: var(--err); border-color: var(--err); }
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid var(--accent); border-top-color: transparent;
    border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .step-line { color: var(--muted); font-size: 12px; text-align: center; }

  /* 输入区改成纵向：输入框在上吃满宽度，工具栏在下。
     原来是横向 flex（文本框 | 附件 | 按钮），一加附件按钮就把输入框挤窄了。 */
  form#composer {
    flex: none; border-top: 1px solid var(--border); background: var(--panel);
    padding: 12px 22px; display: flex; flex-direction: column; gap: 8px;
    max-width: 924px; margin: 0 auto; width: 100%; position: relative;
  }
  .exec-menu {
    position: absolute; bottom: calc(100% - 4px); left: 22px; right: 130px;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-md); max-height: 260px; overflow: auto; z-index: 20;
  }
  .exec-item { padding: 8px 12px; cursor: pointer; display: flex; gap: 8px;
    align-items: center; border-bottom: 1px solid var(--border); }
  .exec-item:last-child { border-bottom: 0; }
  .exec-item:hover { background: var(--panel-2); }
  .exec-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 22px 0; max-width: 924px; margin: 0 auto; width: 100%;
    font-size: 12.5px; color: var(--muted);
  }
  .exec-bar select { font-size: 12.5px; padding: 2px 6px; }
  .exec-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .exec-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 3px 0; }
  .exec-row .seq {
    width: 16px; text-align: center; color: var(--muted); font-size: 11.5px;
    font-variant-numeric: tabular-nums;
  }
  #taskInput {
    width: 100%; resize: vertical; min-height: 44px; max-height: 160px;
    font-family: inherit;
  }
  /* ---- 图片：拖进来 / 粘贴 / 点按钮 ---- */
  #composer.drop { outline: 2px dashed var(--accent, #185fa5); outline-offset: -4px; }
  /* 工具栏：左附件、右发送 */
  .attach-bar {
    display: flex; gap: 8px; align-items: center;
    font-size: 12px; color: var(--muted);
  }
  .attach-bar .spacer { flex: 1 1 auto; }
  .attach-bar button {
    font-size: 12px; padding: 4px 10px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel-2, #fbfaf7); color: var(--text);
    white-space: nowrap;
  }
  .attach-bar button:hover { border-color: var(--accent, #185fa5); }
  .attach-bar #sendBtn { font-size: 13px; padding: 6px 16px; }
  /* 附件预览区：图片是缩略图，文件是带后缀的胶囊 */
  .attachments {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .attachments:empty { display: none; }
  /* 图片：缩略图带移除角标 */
  .att-thumb {
    position: relative; width: 62px; height: 62px; border-radius: 8px;
    border: 1px solid var(--border); overflow: hidden; background: var(--panel-2, #f1efe8);
  }
  .att-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .att-thumb .x {
    position: absolute; top: 1px; right: 1px; width: 16px; height: 16px;
    border: 0; border-radius: 50%; background: rgba(0,0,0,.62); color: #fff;
    font-size: 11px; line-height: 16px; cursor: pointer; padding: 0;
  }
  .att-thumb .x:hover { background: #a32d2d; }
  /* 文件：后缀徽标 + 文件名，长名省略 */
  .att-chip {
    display: flex; align-items: center; gap: 7px; max-width: 240px;
    padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2, #fbfaf7);
  }
  .att-chip .badge {
    flex: none; font-size: 10px; font-weight: 600; letter-spacing: .4px;
    padding: 2px 5px; border-radius: 4px; color: #fff; background: #185fa5;
  }
  .att-chip .name {
    flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .att-chip .x {
    flex: none; width: 16px; height: 16px; border: 0; border-radius: 50%;
    background: transparent; color: var(--muted); font-size: 13px;
    line-height: 1; cursor: pointer; padding: 0;
  }
  .att-chip .x:hover { color: #a32d2d; }
  #empty { margin: auto; text-align: center; color: var(--muted); max-width: 560px; }
  #empty h2 { color: var(--text); font-size: 19px; margin-bottom: 10px; }
  #empty p { line-height: 1.9; }
  #empty .hint {
    margin-top: 14px; padding: 10px 14px; border-radius: 8px;
    background: var(--panel-2); color: var(--text-2); font-size: 12px;
    line-height: 1.8; text-align: left;
  }
  #empty code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--err); border-radius: var(--radius);
    padding: 10px 16px; box-shadow: var(--shadow-md); z-index: 50; font-size: 13px;
  }

  @media (max-width: 860px) {
    main { flex-direction: column-reverse; }
    aside { width: 100%; max-height: 42vh; border-right: none; border-bottom: 1px solid var(--border); }
    #stream { padding: 14px; }
    form#composer { padding: 10px 12px; }
  }
</style>
</head>
<body>
<header>
  <span class="logo">🤖</span>
  <h1>ZK-Agent 任务台</h1>
  <span class="chip" id="wsChip">工作区</span>
  <span class="spacer"></span>
  <select id="modelSel" title="规划用的大模型（网关模型或别名，不是各 CLI 的模型）"></select>
  <button id="cancelBtn" class="small" hidden>■ 停止</button>
  <button id="newBtn" class="primary small">＋ 新任务</button>
</header>

<main>
  <aside>
    <div class="head"><b>任务会话</b><button id="refreshBtn" class="small">↻ 刷新</button></div>
    <div id="sessionList"></div>
  </aside>

  <section class="chat">
    <div id="stream">
      <div id="empty">
        <h2>给 Agent 一个任务</h2>
        <p>例如：<em>把所有脚本的 print 换成 logger</em>、<em>给 app/services 下每个公开函数补 docstring 并跑 pytest 验证</em>。<br>
        模型默认走 <code>zk-auto</code>；写文件和跑命令会先请你批准。</p>
        <p class="hint"><strong>要让桌面应用干活，看这里：</strong><br>
        · 改表格 / 文档 / PPT —— <strong>直接描述任务就行</strong>，Agent 会自己调本机编辑器工具；<br>
        · 让 CodeBuddy、Qoder、Claude 等命令行工具干 —— 点下面的「选执行体」，或打 <code>@</code> 挑一个；<br>
        · 右上角那个下拉是<strong>规划用的大模型</strong>，不是各工具自己的模型。</p>
      </div>
    </div>
    <div id="execBar" class="exec-bar" hidden></div>
    <form id="composer">
      <div id="execMenu" class="exec-menu" hidden></div>
      <textarea id="taskInput" placeholder="描述任务，Enter 发送；@ 可点名执行体，一条消息可点名多个（按顺序串行跑）&#10;图片和文件可以直接粘贴或拖进来"></textarea>
      <div class="attachments" id="attachments"></div>
      <div class="attach-bar">
        <button type="button" id="pickExec">选执行体</button>
        <button type="button" id="pickImage">图片</button>
        <button type="button" id="pickFile">文件</button>
        <input type="file" id="imageInput" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
        <input type="file" id="fileInput" multiple hidden>
        <span class="spacer"></span>
        <button type="submit" class="primary" id="sendBtn">▶ 运行</button>
      </div>
    </form>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const TOKEN = localStorage.getItem("zkai_admin_token") || "";

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

/* ================= 轻量 Markdown 渲染 =================
   为什么需要：模型回的是 Markdown（表格 / 加粗 / 代码块），而原来只是
   esc() 之后塞进 <div>。div 会折叠换行，于是
   `| 角色 | 执行体 |` 那种表格就糊成一整段竖线，人根本读不了（2026-11-02 反馈）。

   安全前提：**先 esc 再解析**。原文里的 < > & " 全部转义，只有本函数自己
   产出的标签能生效，模型输出里夹带的 HTML 不会变成可执行结构。
   支持最小可用集：围栏代码块、表格、标题、列表、引用、分隔线、段落，
   行内：`代码`、**加粗**、*斜体*、~~删除线~~、[链接](url)。
   不做嵌套列表 / 图片 / HTML 直通 —— 聊天窗口不需要，做了反而容易被模型输出带偏。 */

function mdInline(s) {
  // 行内代码先抽走：否则里面的 * 和 _ 会被当成强调语法
  const codes = [];
  let out = s.replace(/`([^`\n]+)`/g, (_, code) => {
    codes.push(code);
    return "\u0001" + (codes.length - 1) + "\u0001";
  });
  out = out
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~\n]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]*)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return out.replace(/\u0001(\d+)\u0001/g, (_, i) => `<code>${codes[Number(i)]}</code>`);
}

function mdCells(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
}

function mdTable(lines) {
  const head = mdCells(lines[0]);
  const align = mdCells(lines[1]).map(c =>
    /^:-+:$/.test(c) ? "center" : /^-+:$/.test(c) ? "right" : /^:-+$/.test(c) ? "left" : "");
  const cell = (tag, text, i) => {
    const a = align[i] ? ` style="text-align:${align[i]}"` : "";
    return `<${tag}${a}>${mdInline(esc(text))}</${tag}>`;
  };
  const th = head.map((c, i) => cell("th", c, i)).join("");
  const rows = lines.slice(2)
    .filter(l => l.trim())
    .map(l => {
      const cells = mdCells(l);
      // 补齐/截断到表头列数：模型偶尔少写一格，缺的补空，多的丢掉
      while (cells.length < head.length) cells.push("");
      return `<tr>${cells.slice(0, head.length).map((c, i) => cell("td", c, i)).join("")}</tr>`;
    }).join("");
  return `<table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;
}

function md(src) {
  const raw = String(src ?? "");
  if (!raw.trim()) return "";
  // 先把围栏代码块抽走：里面的 | 和 * 属于代码，不该被当表格/强调解析
  const fences = [];
  const body = raw.replace(/```[^\n`]*\n([\s\S]*?)```/g, (_, code) => {
    fences.push(code.replace(/\n$/, ""));
    return "\u0000" + (fences.length - 1) + "\u0000";
  });
  const out = [];
  for (const block of body.split(/\n{2,}/)) {
    const text = block.trim();
    if (!text) continue;
    const fence = text.match(/^\u0000(\d+)\u0000$/);
    if (fence) {
      out.push(`<pre class="md-code">${esc(fences[Number(fence[1])])}</pre>`);
      continue;
    }
    const lines = text.split("\n");
    // 表格：首行有竖线 + 次行是 |---|:--:| 这种分隔行
    if (lines.length >= 2 && /^\s*\|.*\|\s*$/.test(lines[0]) && /^[\s:|-]+$/.test(lines[1])
        && lines[1].includes("-") && lines[1].includes("|")) {
      out.push(mdTable(lines));
      continue;
    }
    const heading = text.match(/^(#{1,6})\s+([\s\S]*)$/);
    if (heading) {
      const level = Math.min(heading[1].length, 4);
      out.push(`<h${level}>${mdInline(esc(heading[2]))}</h${level}>`);
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(lines[0])) {
      const ordered = /^\s*\d+\./.test(lines[0]);
      const items = lines
        .filter(l => /^\s*([-*+]|\d+\.)\s+/.test(l))
        .map(l => `<li>${mdInline(esc(l.replace(/^\s*([-*+]|\d+\.)\s+/, "")))}</li>`)
        .join("");
      out.push(ordered ? `<ol>${items}</ol>` : `<ul>${items}</ul>`);
      continue;
    }
    if (/^\s*>/.test(lines[0])) {
      out.push(`<blockquote>${mdInline(esc(lines.map(l => l.replace(/^\s*>\s?/, "")).join("\n")))}</blockquote>`);
      continue;
    }
    if (/^\s*([-*_])\1{2,}\s*$/.test(text)) {
      out.push("<hr>");
      continue;
    }
    out.push(`<p>${mdInline(esc(text)).replace(/\n/g, "<br>")}</p>`);
  }
  return out.join("");
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Token": TOKEN,
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try {
      const body = await res.json();
      msg = body?.error?.message || body?.detail || msg;
    } catch { /* keep status */ }
    throw new Error(msg);
  }
  return res.json();
}

  segsOpen: true,      // 多段设置面板是否展开

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

const AGENT_STATUS_ZH = {
  pending: "排队中", running: "执行中", waiting_approval: "待批准",
  done: "已完成", failed: "失败", cancelled: "已取消", interrupted: "已中断",
};
function statusChip(status) {
  return `<span class="chip ${esc(status)}">${esc(AGENT_STATUS_ZH[status] || status)}</span>`;
}

function renderSessionList(sessions) {
  const list = $("sessionList");
  list.innerHTML = "";
  for (const s of sessions) {
    const div = document.createElement("div");
    div.className = "session" + (s.id === state.current ? " active" : "");
    div.innerHTML = `
      <div class="t">${esc(s.title || "（未命名任务）")}</div>
      <div class="meta">${statusChip(s.status)}
        <span class="small muted">${esc(s.model)} · ${fmtTime(s.updated_at)}</span></div>
      <button class="del" title="删除">🗑</button>`;
    div.onclick = () => openSession(s.id);
    div.querySelector(".del").onclick = async (e) => {
      e.stopPropagation();
      if (!confirm("删除该会话及其全部记录？")) return;
      try { await api(`/zkadmin/agent/sessions/${s.id}`, { method: "DELETE" }); await loadSessions(); }
      catch (err) { toast(err.message); }

  }
}

function addRow(html, cls = "") {
  $("empty")?.remove();
  const stream = $("stream");
  const row = document.createElement("div");
  row.className = `row ${cls}`;
  row.innerHTML = html;
  stream.appendChild(row);
  if (state.autoScroll) stream.scrollTop = stream.scrollHeight;
  return row;
}

function renderTranscript() {
  $("stream").innerHTML = "";
  for (const m of state.messages) appendMessageRow(m);
  const st = state.session?.status;
  if (st === "running" || st === "waiting_approval") addStepLine();
}

function toolCallChips(tcs) {
  if (!tcs?.length) return "";
  return `<div class="tools-line">${tcs.map(tc =>
    `<span class="toolchip">🔧 ${esc(tc.function?.name || "?")}</span>`).join("")}</div>`;
}

function childEventLabel(ev) {
  const names = (ev.tool_calls || []).map(c => c.function?.name || "").join("、");
  const map = {
    step_start: `第 ${ev.step} 步开始`,
    assistant: ev.tool_calls?.length ? `调用了 ${names}` : "给出了中间答复",
    tool_result: `工具 ${ev.tool || ""}${ev.ok ? " 成功" : " 失败"}`,
    session_done: ev.status === "done" ? "已完成" : `结束（${ev.status}）`,
    note: "有新的进展说明",
  };
  return map[ev.type] || "有更新";
}

function appendMessageRow(m) {
  const d = m.data || {};
  if (m.role === "user") {
    if (m.kind === "summary") {
      addRow(`<div class="card small muted"><b>上下文摘要</b><br>${esc(m.content)}</div>`);
    } else {
      const who = (m.data || {}).executor
        ? `<div class="routing">⚡ 派给 ${esc(m.data.executor)}${m.data.model ? ` · ${esc(m.data.model)}` : ""}</div>`
        : "";
      addRow(`<div class="card"><div class="md">${md(m.content)}</div>${who}</div>`, "user");
    }
    return;
  }
  if (m.kind === "note") {
    addRow(`<div class="step-line">— ${esc(m.content)} —</div>`);
    return;
  }
  if (m.kind === "approval") {
    if (d.decision !== undefined) {
      addRow(`<div class="card small"><b>${d.decision ? "✅ 已批准" : "🚫 已拒绝"}</b>
        <span class="muted">${esc(d.tool)}</span>${d.remember ? "（本会话不再询问）" : ""}</div>`);
    } else {
      renderApprovalCard(m);
    }
    return;
  }
  if (d.tool === "spawn_subagent") {
    // 子任务：结论是关键，因此单独一张卡而不是糊一脸 <pre>。
    // child_session 可点，直接跳到那个子会话看完整过程。
    const kid = d.child_session;
    const jump = kid
      ? `<button class="linklike" data-kid="${esc(kid)}">查看子会话 ${esc(kid.slice(0, 8))}</button>`
      : "";
    const row = addRow(`<div class="card" style="border-left:3px solid var(--accent)">
      <div class="who">🧩 派生子任务
        <span class="chip ${d.ok ? "done" : "failed"}">${d.ok ? "已完成" : "未完成"}</span></div>
      <div class="spawn-body md">${md(m.content)}</div>${jump}</div>`);
    const btn = row.querySelector("[data-kid]");
    if (btn) btn.onclick = () => openSession(btn.dataset.kid);
    return;
  }
  if (m.role === "tool") {
    addRow(`<div class="card"><div class="who">🔧 ${esc(d.tool || "tool")}
      <span class="chip ${d.ok ? "done" : "failed"}">${d.ok ? "成功" : "失败"}</span></div>
      <pre>${esc(m.content || "")}</pre></div>`);
    return;
  }
  // assistant message
  const routing = d.routing
    ? `<div class="routing">${esc(d.routing.provider || "")} · ${esc(d.routing.model || "")} · ${d.routing.latency_ms ?? "?"}ms</div>` : "";
  const ex = d.executor
    ? `<div class="routing">⚡ ${esc(d.executor.role)} · ${esc(d.executor.model)} ·
       ${d.executor.cost_tier === "free" ? "免费档" : esc(d.executor.cost_tier)} ·
       思考 ${esc(d.executor.effort || "默认")} · ${fmtCtx(d.executor.context_window)} ·
       ${d.executor.elapsed ?? "?"}s${d.executor.total > 1 ? ` · 第 ${d.executor.index}/${d.executor.total} 段` : ""}</div>`
    : "";
  const thinking = d.thinking
    ? `<details><summary>💭 思考过程</summary><pre>${esc(d.thinking)}</pre></details>` : "";
  const pending = d.tool_calls?.length && state.session?.status === "waiting_approval";
  addRow(`<div class="card"><div class="who">🤖 助手 <span class="muted small">#${m.seq}</span></div>
    <div class="md">${md(m.content)}</div>${toolCallChips(d.tool_calls)}${thinking}${ex}${routing}</div>`);
}

function renderApprovalCard(m) {
  const d = m.data || {};
  const row = addRow(`<div class="card" style="border-left:3px solid var(--warn)">
    <div class="who">⚠️ 请求批准：<b>${esc(d.tool)}</b></div>
    <pre>${esc(m.content || "")}</pre>
    <div class="approval-actions">
      <button class="ok" data-act="approve">✓ 批准</button>
      <button class="no" data-act="deny">✕ 拒绝</button>
      <button data-act="remember">✓ 批准且本会话不再询问</button>
    </div></div>`);
  row.querySelectorAll("button").forEach(btn => {
    btn.onclick = async () => {
      const approved = btn.dataset.act !== "deny";
      const remember = btn.dataset.act === "remember";
      try {
        await api(`/zkadmin/agent/sessions/${state.current}/approvals/${d.approval_id}`, {
          method: "POST", body: JSON.stringify({ approved, remember }),
        });
        row.querySelector(".approval-actions").remove();
        row.insertAdjacentHTML("beforeend",
          `<div class="routing">${approved ? "已批准，执行中…" : "已拒绝。"}</div>`);
      } catch (err) { toast(err.message); }
    };
  });
}

function addStepLine(text) {
  const stream = $("stream");
  const old = stream.querySelector(".step-live");
  if (old) old.remove();
  const row = document.createElement("div");
  row.className = "row step-line step-live";
  row.innerHTML = text
    ? esc(text)
    : `<span class="spinner"></span> 模型思考中…（此步可能需要 1 分钟以上）`;
  stream.appendChild(row);
  if (state.autoScroll) stream.scrollTop = stream.scrollHeight;
}

function setHeader() {
  const s = state.session;
  const active = s && (s.status === "running" || s.status === "waiting_approval");
  $("cancelBtn").hidden = !active;
  $("wsChip").textContent = s?.workspace ? s.workspace.split(/[\\/]/).pop() : "未开始";
  $("sendBtn").disabled = !!active;
  $("sendBtn").textContent = active ? "执行中…" : (state.current ? "▶ 继续" : "▶ 运行");
}

// ---------------------------------------------------------------- SSE
async function connectEvents(sessionId) {
  state.streamCtrl?.abort();
  const ctrl = new AbortController();
  state.streamCtrl = ctrl;
  try {
    const res = await fetch(`/zkadmin/agent/sessions/${sessionId}/events`, {
      headers: { "X-Admin-Token": TOKEN, Accept: "text/event-stream" },
      signal: ctrl.signal,
    });
    if (!res.ok || !res.body) throw new Error(`事件流连接失败（HTTP ${res.status}）`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const chunk = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        for (const line of chunk.split("\n")) {
          if (line.startsWith("data: ")) handleEvent(JSON.parse(line.slice(6)));
        }
      }
    }
  } catch (err) {
    if (ctrl.signal.aborted) return;
    addStepLine(`连接中断（${err.message}），可点「刷新」重试`);
  }
}

function handleEvent(ev) {
  switch (ev.type) {
    case "snapshot":
      state.session = ev.session;
      state.messages = ev.messages;
      renderTranscript();
      setHeader();
      return;
    case "session_started":
      state.session && (state.session.status = "running");
      setHeader();
      addStepLine(`任务启动 · 模型 ${ev.model} · 工作区 ${ev.workspace}`);
      return;
    case "step_start":
      addStepLine();
      return;
    case "assistant":
      state.messages.push({ seq: ev.seq, role: "assistant", kind: "message",
        content: ev.content || null, data: { tool_calls: ev.tool_calls, thinking: ev.thinking, routing: ev.routing, executor: ev.executor } });
      appendMessageRow(state.messages[state.messages.length - 1]);
      if (!ev.tool_calls?.length) addStepLine(`第 ${ev.step} 步完成，等待模型后续…`);
      return;
    case "approval_request":
      state.session && (state.session.status = "waiting_approval");
      setHeader();
      state.messages.push({ seq: ev.seq, role: "assistant", kind: "approval",
        content: ev.preview, data: { approval_id: ev.approval_id, tool: ev.tool } });
      appendMessageRow(state.messages[state.messages.length - 1]);
      loadSessions();
      return;
    case "approval_resolved":
      state.session && (state.session.status = "running");
      setHeader();
      return;
    case "tool_result":
      state.messages.push({ seq: ev.seq, role: "tool", kind: "tool_result",
        content: ev.output, data: { tool: ev.tool, ok: ev.ok } });
      appendMessageRow(state.messages[state.messages.length - 1]);
      return;
    case "note":
      addRow(`<div class="step-line">— ${esc(ev.content)} —</div>`);
      return;
    case "child_event":
      // 子会话的进度透传：给父页面一行可见性，细节去子会话里看。
      addRow(`<div class="step-line">子任务 ${esc((ev.child_session || "").slice(0, 8))}·${esc(childEventLabel(ev))}</div>`);
      return;
    case "session_done": {
      const old = document.querySelector(".step-live");
      if (old) old.remove();
      state.session && (state.session.status = ev.status);
      const label = ev.status === "done" ? "任务完成 ✅" :
        ev.status === "failed" ? `任务失败：${ev.error || "?"}` :
        ev.status === "cancelled" ? "已取消" :
        ev.status === "interrupted" ? "网关重启导致任务中断，接着发消息即可续跑" :
        (AGENT_STATUS_ZH[ev.status] || ev.status);
      addRow(`<div class="step-line">${esc(label)}</div>`);
      setHeader();
      loadSessions();
      return;
    }
    default:
  }
}

// ---------------------------------------------------------------- executors
// 输入框任意位置打 @ 点名执行体；一条消息可点名多个，按顺序串行。
// 每段都能单独设置模型/思考/上下文（可折叠），不设就用该执行体的配置默认。
function execById(role) {
  return state.executors.find(e => e.role === role) || null;
}

function loadExecutors() {
  api("/zkadmin/agent/executors")
    .then(d => { state.executors = d.executors || []; })
    .catch(() => { /* 未启用执行体时静默 */ });
}

// 光标前正在输入的 mention：`@xxx` 任意位置；`/xxx` 只认行首（避免和路径打架）
function mentionAt(text, caret) {
  const before = text.slice(0, caret);
  // 分隔符与 parseMentions 保持一致：中文标点后也能直接 @
  let m = /(^|[\s，,。；;、：:])@([A-Za-z0-9_.-]*)$/.exec(before);
  if (m) return { start: caret - m[2].length - 1, prefix: m[2] };
  m = /^\/([A-Za-z0-9_.-]*)$/.exec(before);
  if (m) return { start: 0, prefix: m[1] };
  return null;
}

function showExecMenu(prefix) {
  const menu = $("execMenu");
  const list = state.executors.filter(e =>
    e.role.toLowerCase().startsWith(prefix.toLowerCase()) ||
    e.tool.toLowerCase().startsWith(prefix.toLowerCase()));
  if (!list.length) { menu.hidden = true; return; }
  menu.innerHTML = list.map(e => `
    <div class="exec-item" data-role="${esc(e.role)}">
      <b>${esc(e.role)}</b>
      <span class="small muted">${esc(e.tool)} · ${esc(e.model)}</span>
      <span class="chip">${e.cost_tier === "free" ? "免费档" : esc(e.cost_tier)}</span>
    </div>`).join("");
  menu.hidden = false;
  menu.querySelectorAll(".exec-item").forEach(el => {
    el.onclick = () => insertMention(el.dataset.role);
  });
}

function insertMention(role) {
  const el = $("taskInput");
  const caret = el.selectionStart || el.value.length;
  const hit = mentionAt(el.value, caret);
  const token = `@${role} `;
  if (hit) {
    el.value = el.value.slice(0, hit.start) + token + el.value.slice(caret);
    el.selectionStart = el.selectionEnd = hit.start + token.length;
  } else {
    el.value = `${el.value}${token}`;
    el.selectionStart = el.selectionEnd = el.value.length;
  }
  $("execMenu").hidden = true;
  el.focus();
  updateExecBar();
}

// 段首尾的标点和「用/然后/再」这类连接词不属于任务本身
function cleanTask(raw) {
  let t = String(raw || "").trim();
  // 可能连着好几个连接词（「…，再用」），剥到稳定为止
  for (let i = 0; i < 5; i++) {
    const before = t;
    t = t.replace(/^[，,、;；:：\s]+/, "").replace(/[，,、;；:：\s]+$/, "");
    t = t.replace(/(用|然后|再|以及|并且|并|和)$/, "").trim();
    if (t === before) break;
  }
  return t;
}

// 把一条消息切成多段：每段从自己的 @角色 开始，到下一个 @角色 之前结束。
// 第一个 @ 之前的文字（「帮我」「用」之类）并进第一段，不丢上下文。
function parseMentions(text) {
  // 中文里常见「…，@角色」这种不空格的写法，所以分隔符要包含中文标点
  const re = /(^|[\s，,。；;、：:])@([A-Za-z0-9_.-]+)/g;
  const hits = Array.from(text.matchAll(re));
  if (!hits.length) return [];
  const segments = [];
  const preamble = cleanTask(text.slice(0, hits[0].index));
  hits.forEach((m, i) => {
    const start = m.index + m[0].length;
    const end = i + 1 < hits.length ? hits[i + 1].index : text.length;
    let task = cleanTask(text.slice(start, end));
    if (i === 0 && preamble) task = `${preamble}\n${task}`;
    segments.push({ role: m[2], task });
  });
  return segments;
}

function segDefaults(role) {
  const e = execById(role);
  return {
    role,
    model: e ? e.model : "",
    effort: e ? (e.effort || "") : "",
    context_window: e ? (e.context_window || 0) : 0,
  };
}

// 文本变了就按新分段对齐设置：同一位置同角色保留用户的选择，否则回落到默认。
function syncSegments(segs) {
  const next = segs.map((s, i) => {
    const prev = state.segs[i];
    return prev && prev.role === s.role ? prev : segDefaults(s.role);
  });
  state.segs = next;
}

async function refreshModels(role) {
  try {
    const d = await api(`/zkadmin/agent/executors/${encodeURIComponent(role)}/models`);
    const e = execById(role);
    if (!e) return;
    e.models = d.models || [];
    state.sig = "";          // 清单变了，强制重绘一次
    updateExecBar();
  } catch { /* 拿不到真实清单就继续用配置里的 */ }
}

function fmtCtx(n) {
  if (!n) return "默认上下文";
  return n >= 1000000 ? "1M" : `${Math.round(n / 1000)}K`;
}

function selectOpts(values, current) {
  return values.map(([v, label]) =>
    `<option value="${esc(v)}"${String(v) === String(current) ? " selected" : ""}>${label}</option>`
  ).join("");
}

const EFFORT_OPTS = [["", "默认思考"], ["minimal", "minimal"], ["low", "low"],
  ["medium", "medium"], ["high", "high"], ["xhigh", "xhigh"], ["max", "max"]];
const CTX_OPTS = [[0, "默认上下文"], [128000, "128K"], [200000, "200K"], [1000000, "1M"]];

function renderExecBar(segs) {
  const bar = $("execBar");
  const open = state.segsOpen;
  let html = `<div class="exec-head">
    <span class="chip">⚡ ${segs.length} 段</span>
    <span class="small muted">按顺序串行</span>
    <button type="button" class="linklike" id="execToggle">${open ? "收起设置" : "设置每一段"}</button>
  </div>`;

  if (open) {
    html += segs.map((s, i) => {
      const e = execById(s.role);
      if (!e) {
        return `<div class="exec-row"><span class="seq">${i + 1}</span>
          <span class="chip">⚠️ ${esc(s.role)}</span>
          <span class="small muted">未知执行体，提交会被拒绝</span></div>`;
      }
      const st = state.segs[i] || segDefaults(s.role);
      const models = selectOpts(
        (e.models && e.models.length ? e.models : [{ id: e.model || "", free: false }])
          .map(m => [m.id, `${m.id || "CLI 自配模型"}${m.free ? "（免费）" : ""}`]),
        st.model,
      );
      const hasEffort = (e.knobs || []).includes("effort");
      const hasCtx = (e.knobs || []).includes("context_window");
      return `<div class="exec-row">
        <span class="seq">${i + 1}</span>
        <span class="chip">${esc(e.role)}</span>
        <label class="small">模型 <select data-i="${i}" data-k="model">${models}</select></label>
        ${hasEffort ? `<label class="small">思考 <select data-i="${i}" data-k="effort">${selectOpts(EFFORT_OPTS, st.effort)}</select></label>` : ""}
        ${hasCtx ? `<label class="small">上下文 <select data-i="${i}" data-k="context_window">${selectOpts(CTX_OPTS, st.context_window)}</select></label>` : ""}
      </div>`;
    }).join("");
  } else {
    html += `<span class="small muted">${segs.map((s, i) => `${i + 1}. ${esc(s.role)}`).join("　")}</span>`;
  }

  bar.innerHTML = html;
  bar.hidden = false;
  $("execToggle").onclick = () => {
    state.segsOpen = !state.segsOpen;
    state.sig = "";
    updateExecBar();
  };
  bar.querySelectorAll("select[data-i]").forEach(el => {
    el.onchange = () => {
      const i = Number(el.dataset.i);
      const k = el.dataset.k;
      if (!state.segs[i]) return;
      state.segs[i][k] = k === "context_window" ? Number(el.value) : el.value;
    };
  });
}

function updateExecBar() {
  const bar = $("execBar");
  const segs = parseMentions($("taskInput").value);
  if (!segs.length) {
    bar.hidden = true;
    bar.innerHTML = "";
    state.segs = [];
    state.sig = "";
    return;
  }
  syncSegments(segs);
  const sig = `${segs.map(s => s.role).join("|")}#${segs.length}@${state.segsOpen}`;
  if (sig === state.sig) return;
  state.sig = sig;
  renderExecBar(segs);
  for (const role of new Set(segs.map(s => s.role))) {
    if (!state.asked.has(role)) {
      state.asked.add(role);
      refreshModels(role);   // 每个角色只问一次真实模型清单
    }
  }
}

// ---------------------------------------------------------------- actions
async function loadSessions() {
  try {
    const data = await api("/zkadmin/agent/sessions");
    renderSessionList(data.sessions);
  } catch (err) { toast(err.message); }
}

async function openSession(id) {
  state.current = id;
  try {
    const detail = await api(`/zkadmin/agent/sessions/${id}`);
    state.session = detail.session;
    state.messages = detail.messages;
    renderTranscript();
    setHeader();
    renderSessionList((await api("/zkadmin/agent/sessions")).sessions);
    if (detail.session.status === "running" || detail.session.status === "waiting_approval") {
      connectEvents(id);
    }
  } catch (err) { toast(err.message); }
}

async function loadModels() {
  try {
    const data = await api("/zkadmin/agent/models");
    const sel = $("modelSel");
    sel.innerHTML = "";
    for (const alias of data.aliases) {
      sel.insertAdjacentHTML("beforeend", `<option value="${esc(alias)}">${esc(alias)}（别名）</option>`);
    }
    for (const m of data.models) {
      sel.insertAdjacentHTML("beforeend", `<option value="${esc(m)}">${esc(m)}</option>`);
    }
    if (data.aliases.includes(data.default)) sel.value = data.default;
  } catch { /* 无 token 时静默 */ }
}

$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const input = $("taskInput");
  const text = input.value.trim();
  // 只有图没有字也允许发 —— 「看看这块刀片崩在哪」经常配一张图
  if (!text && !state.images.length && !state.files.length) return;
  try {
    const segments = parseMentions(text);
    if (segments.length) {
      const unknown = segments.filter(s => !execById(s.role));
      if (unknown.length) {
        toast(`未知执行体：${unknown.map(s => s.role).join("、")}；可用：${state.executors.map(e => e.role).join("、")}`);
        return;
      }
      const empty = segments.find(s => !s.task);
      if (empty) {
        toast(`@${empty.role} 后面还没写任务`);
        return;
      }
      // 每段带上自己在设置面板里的选择（没改过就是执行体默认）
      const items = segments.map((s, i) => {
        const st = state.segs[i] || segDefaults(s.role);
        const item = { role: s.role, task: s.task };
        if (st.model) item.model = st.model;
        if (st.effort) item.effort = st.effort;
        if (st.context_window) item.context_window = st.context_window;
        return item;
      });
      const active = state.session && (state.session.status === "running" ||
                                       state.session.status === "waiting_approval");
      const payload = { items };
      if (state.current && !active) payload.session_id = state.current;   // 同一轮对话里继续追加
      const created = await api("/zkadmin/agent/delegations", {
        method: "POST", body: JSON.stringify(payload),
      });
      input.value = "";
      clearAttachments();
      state.current = created.session.id;
      state.session = created.session;
      state.messages = created.messages || [];
      state.segs = [];
      state.sig = "";
      state.asked.clear();
      renderTranscript();
      updateExecBar();
      setHeader();
      connectEvents(state.current);
      loadSessions();
      return;
    }
    if (!state.current) {
      const created = await api("/zkadmin/agent/sessions", {
        method: "POST",
        body: JSON.stringify({
          task: text,
          model: $("modelSel").value || null,
          images: state.images,
          files: state.files,
        }),
      });
      input.value = "";
      clearAttachments();
      state.current = created.session.id;
      state.session = created.session;
      state.messages = [];
      renderTranscript();
      setHeader();
      connectEvents(state.current);
      loadSessions();
    } else {
      await api(`/zkadmin/agent/sessions/${state.current}/messages`, {
        method: "POST", body: JSON.stringify({ content: text, images: state.images, files: state.files }),
      });
      input.value = "";
      clearAttachments();
      state.messages.push({ seq: 0, role: "user", kind: "task", content: text });
      appendMessageRow(state.messages[state.messages.length - 1]);
      addStepLine();
      state.session.status = "running";
      setHeader();
      connectEvents(state.current);
    }
  } catch (err) { toast(err.message); }
};

$("taskInput").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { $("execMenu").hidden = true; return; }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("execMenu").hidden = true;
    $("composer").requestSubmit();
  }
});

function refreshMentionMenu() {
  const el = $("taskInput");
  const hit = mentionAt(el.value, el.selectionStart || 0);
  if (hit) showExecMenu(hit.prefix); else $("execMenu").hidden = true;
}

$("taskInput").addEventListener("input", () => {
  refreshMentionMenu();
  updateExecBar();
});
$("taskInput").addEventListener("click", refreshMentionMenu);
$("taskInput").addEventListener("keyup", refreshMentionMenu);

// 「选执行体」按钮：等价于在光标处打一个 @，把面板弹出来 ——
// 不熟悉的人不会想到要打 @，给一个看得见的入口。
$("pickExec").onclick = () => {
  const input = $("taskInput");
  const text = input.value;
  input.value = text && !/\s$/.test(text) ? text + " @" : text + "@";
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  input.dispatchEvent(new Event("input"));
};

/* ================= 附件（图片 + 文件） =================
   三条入口（点按钮 / 粘贴 / 拖拽）收成同一个形状：state.images 与 state.files。
   图片走 data URL（OpenAI 的 image_url part 本来就接受），
   文件走 name + data，后端落盘到 data/agent_uploads/ 并把真实路径写进任务正文。
   为什么文件不进 prompt：Agent 有读写工具，给它路径比给它全文有用得多。
   限制与后端 _normalise_images / _store_files 对齐：单个 10MB、一次最多 8 个。 */
const ATT_MAX_CHARS = 10 * 1024 * 1024;
const ATT_MAX = 8;

function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(new Error(file.name + " 读不出来"));
    reader.readAsDataURL(file);
  });
}

function isImage(file) {
  return /^image\/(png|jpeg|gif|webp)$/.test(file.type);
}

async function addAttachments(fileList) {
  const list = Array.from(fileList || []);
  if (!list.length) return;
  for (const file of list) {
    if (state.images.length + state.files.length >= ATT_MAX) {
      toast("一次最多 " + ATT_MAX + " 个附件");
      break;
    }
    if (file.size > ATT_MAX_CHARS) {
      toast(file.name + " 超过 10MB，传不了");
      continue;
    }
    try {
      const data = await readAsDataURL(file);
      if (isImage(file)) {
        state.images.push(data);
      } else {
        state.files.push({ name: file.name, data: data, size: file.size });
      }
    } catch (err) {
      toast(err.message);
    }
  }
  renderAttachments();
}

function fileBadge(name) {
  const dot = name.lastIndexOf(".");
  const ext = dot >= 0 ? name.slice(dot + 1).toLowerCase() : "file";
  const map = {
    xlsx: "XLS", xls: "XLS", csv: "CSV", pdf: "PDF", docx: "DOC", doc: "DOC",
    txt: "TXT", md: "MD", json: "JSON", zip: "ZIP", png: "PNG", jpg: "JPG",
  };
  return map[ext] || ext.slice(0, 4).toUpperCase();
}

function renderAttachments() {
  const box = $("attachments");
  box.innerHTML = "";
  state.images.forEach((src, i) => {
    const wrap = document.createElement("div");
    wrap.className = "att-thumb";
    const img = document.createElement("img");
    img.src = src;
    img.alt = "图片 " + (i + 1);
    const x = document.createElement("button");
    x.type = "button";
    x.className = "x";
    x.textContent = "×";
    x.title = "移除这张";
    x.onclick = () => { state.images.splice(i, 1); renderAttachments(); };
    wrap.appendChild(img);
    wrap.appendChild(x);
    box.appendChild(wrap);
  });
  state.files.forEach((f, i) => {
    const chip = document.createElement("div");
    chip.className = "att-chip";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = fileBadge(f.name);
    const label = document.createElement("span");
    label.className = "name";
    label.textContent = f.name;
    label.title = f.name;
    const x = document.createElement("button");
    x.type = "button";
    x.className = "x";
    x.textContent = "×";
    x.title = "移除这个";
    x.onclick = () => { state.files.splice(i, 1); renderAttachments(); };
    chip.appendChild(badge);
    chip.appendChild(label);
    chip.appendChild(x);
    box.appendChild(chip);
  });
}

function clearAttachments() {
  state.images = [];
  state.files = [];
  renderAttachments();
}

$("pickImage").onclick = () => $("imageInput").click();
$("imageInput").onchange = (e) => {
  addAttachments(e.target.files);
  e.target.value = "";
};

$("pickFile").onclick = () => $("fileInput").click();
$("fileInput").onchange = (e) => {
  addAttachments(e.target.files);
  e.target.value = "";
};


function clipboardFiles(e) {
  const out = [];
  const items = e.clipboardData && e.clipboardData.items;
  if (items) {
    for (const item of items) {
      if (item.kind === "file") {
        const f = item.getAsFile();
        if (f) out.push(f);
      }
    }
  }
  return out;
}

$("taskInput").addEventListener("paste", (e) => {
  const files = clipboardFiles(e).filter(isImage);
  if (files.length) {
    e.preventDefault();
    addAttachments(files);
  }
});


const composerEl = $("composer");
composerEl.addEventListener("dragover", (e) => {
  if (e.dataTransfer && Array.from(e.dataTransfer.types).includes("Files")) {
    e.preventDefault();
    composerEl.classList.add("drop");
  }
});
composerEl.addEventListener("dragleave", () => composerEl.classList.remove("drop"));
composerEl.addEventListener("drop", (e) => {
  if (!e.dataTransfer) return;
  const files = Array.from(e.dataTransfer.files || []);
  if (files.length) {
    e.preventDefault();
    composerEl.classList.remove("drop");
    addAttachments(files);
  }
});


$("newBtn").onclick = () => {
  state.current = null;
  state.session = null;
  state.messages = [];
  state.streamCtrl?.abort();
  $("stream").innerHTML = `<div id="empty"><h2>给 Agent 一个任务</h2>
    <p>模型默认走 <code>zk-auto</code>；写文件和跑命令会先请你批准。</p></div>`;
  setHeader();
  $("taskInput").focus();
};

$("cancelBtn").onclick = async () => {
  if (!state.current) return;
  try {
    await api(`/zkadmin/agent/sessions/${state.current}/cancel`, { method: "POST" });
    toast("已请求取消");
  } catch (err) { toast(err.message); }
};

$("refreshBtn").onclick = () => {
  loadSessions();
  if (state.current) openSession(state.current);
};

$("stream").addEventListener("scroll", (e) => {
  const el = e.target;
  state.autoScroll = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
});

loadSessions().then(() => {
  // ?session=<id> 直达某个会话：事件中台「点开任务 → 跳到当时 Agent 干活的会话」
  // 就靠这个。没有参数就停在空态，不擅自替用户打开某个历史会话。
  const wanted = new URLSearchParams(location.search).get("session");
  if (wanted) openSession(wanted);
});
loadModels();
loadExecutors();
setHeader();
</script>
