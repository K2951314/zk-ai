<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZK-AI 控制台</title>
<style>
  /* ==========================================================================
     ZK-AI 控制台 · 浅色设计系统
     配色：中性灰底 + 白卡片 + 单一蓝色主色 + 语义色（绿/琥珀/红/灰）
     版式：中文优先，13 / 14 / 16 三档字号，4 / 8 / 12 / 16 间距栅格
     ========================================================================== */
  /* ==========================================================================
     ZK-AI 控制台 · 设计系统（2026-09-30 参照 aihot.news/leaderboard 重做）

     参考站的做法，以及为什么这样搬：
       · 暖白纸底 #faf9f6 + 三档沉色（sunk/muted）分层，而不是冷灰平铺——
         六屏运维数据连看一小时，冷灰会让眼睛先累；纸底降低文字的黑白对比峰值。
       · 单一深青主色 #176b75（暗色模式亮青 #12ccd8）。原蓝色 #2563eb 是「通用
         SaaS 蓝」，跟暖白底不咬合，且和告警红/通过绿的色相距离太近，状态徽标
         在屏上一字排开时分不清谁是谁。
       · 九档字阶（9 / 10.5 / 11 / 12 / 13 / 14.5 / 15 / 20 / 26），主力是 12 与
         14.5——表格密度上限。原来只有 13 一档，导致「次要说明」和「正文」
         只能用颜色区分，扫读时抓不住层级。
       · mono 数字 + 列宽对齐：这是参考站 188 处 mono 的核心——一列 token 数
         竖着扫，等宽才能比大小。原有实现把数字和标签用同一字体，数量级要看
         完整个数字才知道。
       · 胶囊徽标（rounded-full）承载状态：正常/冷却/异常/禁用四态在池子视图
         里每行都有，胶囊比有边方块更省横向空间，也更像「标签」而非「按钮」。
     色彩一律走 token，不写死 hex——暗色模式只换 token 值，不动一处选择器。
     ========================================================================== */
  :root {
    /* 底色三档：页面 / 沉一档（分组底、表头）/ 沉二档（代码块、次级分区） */
    --bg: #faf9f6;
    --bg-sunk: #f3f3ef;
    --bg-muted: #e9ede9;
    --surface: #ffffff;
    --surface-2: #fdfdfb;
    --raised: #ffffff;
    --sidebar: #fdfdfb;
    --field: #eef1ed;
    /* 文字四档：正文 / 次正文 / 辅助 / 最弱（占位、禁用） */
    --ink: #202a30;
    --ink-2: #303c42;
    --ink-3: #59656b;
    --ink-4: #657176;
    --text: var(--ink);
    --text-2: var(--ink-2);
    --muted: var(--ink-3);
    /* 线条三档：分隔 / 强分隔（表头、输入框边）/ 弱分隔（卡片内嵌块） */
    --line: #dfe4e1;
    --line-strong: #d1d9d5;
    --line-soft: #e9ede9;
    --border: var(--line);
    --border-strong: var(--line-strong);
    /* 主色：深青 */
    --accent: #176b75;
    --accent-hover: #145f68;
    --accent-ink: #145f68;
    --accent-soft: rgba(23, 107, 117, .08);
    --accent-softer: rgba(23, 107, 117, .05);
    --accent-border: rgba(23, 107, 117, .28);
    /* 语义色：红=坏 / 琥珀=需注意 / 绿=好 / 灰=禁用 */
    --err: #b3402a;   --err-soft: rgba(179, 64, 42, .08);  --err-border: rgba(179, 64, 42, .25);
    --warn: #b8873a;  --warn-soft: rgba(184, 135, 58, .09); --warn-border: rgba(184, 135, 58, .28);
    --ok: #2f7d5c;    --ok-soft: rgba(47, 125, 92, .09);   --ok-border: rgba(47, 125, 92, .25);
    --neutral: #6b7684; --neutral-soft: rgba(107, 118, 132, .09); --neutral-border: rgba(107, 118, 132, .22);
    /* 排行色：前三名与其余（池子/模型页里用来标「谁是首选」） */
    --rank-1: #b3402a; --rank-2: #a3642f; --rank-3: #96702e; --rank-rest: #6b7684;
    /* 圆角刻度（参考站 six-step） */
    --radius: 8px;          /* 控件 */
    --radius-sm: 6px;
    --radius-tile: 10px;    /* 小组件 */
    --radius-card: 12px;    /* 卡片 */
    --radius-panel: 14px;   /* 大面板 */
    /* 阴影克制：浅色模式下几乎只用一道 1px 边，阴影只给浮层 */
    --shadow-sm: 0 1px 2px rgba(32, 42, 48, .04);
    --shadow-md: 0 3px 12px rgba(32, 42, 48, .08);
    --shadow-lg: 0 12px 32px rgba(32, 42, 48, .16);
    /* 字阶（上面注释里的九档） */
    --fs-9: 9px; --fs-10: 10.5px; --fs-11: 11px; --fs-12: 12px;
    --fs-13: 13px; --fs-14: 14.5px; --fs-15: 15px; --fs-20: 20px; --fs-26: 26px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas,
            "Cascadia Mono", "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #13191c;
    --bg-sunk: #182024;
    --bg-muted: #202a2f;
    --surface: #1a2226;
    --surface-2: #1d272b;
    --raised: #202a2f;
    --sidebar: #161e21;
    --field: rgba(255, 255, 255, .06);
    --ink: #e7eceb;
    --ink-2: #d2dada;
    --ink-3: #a5b0b3;
    --ink-4: #89979d;
    --line: rgba(255, 255, 255, .08);
    --line-strong: rgba(255, 255, 255, .12);
    --line-soft: rgba(255, 255, 255, .06);
    --accent: #12ccd8;
    --accent-hover: #2ce2e8;
    --accent-ink: #2ce2e8;
    --accent-soft: rgba(18, 204, 216, .12);
    --accent-softer: rgba(18, 204, 216, .06);
    --accent-border: rgba(18, 204, 216, .32);
    --err: #d86a52;  --err-soft: rgba(216, 106, 82, .12);  --err-border: rgba(216, 106, 82, .32);
    --warn: #d3b26a; --warn-soft: rgba(211, 178, 106, .12); --warn-border: rgba(211, 178, 106, .32);
    --ok: #5fc79a;   --ok-soft: rgba(95, 199, 154, .12);   --ok-border: rgba(95, 199, 154, .32);
    --neutral: #7b869a; --neutral-soft: rgba(123, 134, 154, .12); --neutral-border: rgba(123, 134, 154, .28);
    --rank-1: #d86a52; --rank-2: #d18a5e; --rank-3: #d3b26a; --rank-rest: #7b869a;
    --shadow-sm: none;
    --shadow-md: 0 6px 18px rgba(0, 0, 0, .35);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, .45);
  }

  :root[data-theme="dark"] .card,
  :root[data-theme="dark"] .tablewrap,
  :root[data-theme="dark"] .filters,
  :root[data-theme="dark"] .kpi,
  :root[data-theme="dark"] .sidebar { box-shadow: none; }
  :root[data-theme="dark"] .modal-mask,
  :root[data-theme="dark"] #auth { background: rgba(6, 9, 14, .78); backdrop-filter: blur(2px); }
  :root[data-theme="dark"] .toast { box-shadow: var(--shadow-md); }
  :root[data-theme="dark"] .nav-item.active { background: var(--accent-soft); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* 根节点水平禁止滚动：否则任何一处超宽都会把视口撑开（
     innerWidth 翻到 869），固定定位的底部 Tab 就会飘到屏幕外。 */
  html, body { max-width: 100%; overflow-x: hidden; }
  html { overflow-x: hidden; }

  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
          "Segoe UI", system-ui, sans-serif;
  }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; }
  button { font: inherit; cursor: pointer; }
  code, pre, .mono { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }

  /* ---------- 应用骨架：左侧导航 + 内容区 ---------- */
  .app { display: flex; min-height: 100vh; align-items: stretch; }
  .sidebar {
    width: 208px; flex: none; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    box-shadow: var(--shadow-sm);
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    padding: 16px 16px 14px; border-bottom: 1px solid var(--border);
  }
  .brand .mark {
    width: 28px; height: 28px; border-radius: 7px; flex: none;
    background: linear-gradient(135deg, var(--accent), #4f8cff);
    display: grid; place-items: center; color: #fff; font-size: var(--fs-15);
    box-shadow: 0 2px 6px rgba(37, 99, 235, .32);
  }
  .brand .name { font-size: var(--fs-15); font-weight: 700; letter-spacing: .2px; color: var(--text); }
  .brand .sub { font-size: var(--fs-11); color: var(--muted); margin-top: 1px; }
  .nav { padding: 10px 10px 6px; display: flex; flex-direction: column; gap: 2px; }
  .nav-label {
    font-size: var(--fs-11); color: var(--muted); font-weight: 600;
    letter-spacing: .4px; padding: 10px 8px 4px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--text-2);
    font-size: var(--fs-13); font-weight: 500; text-align: left; width: 100%;
    transition: background .14s, color .14s;
  }
  .nav-item:hover { background: var(--bg-sunk); color: var(--text); }
  /* 体检页是跳转（<a>）而非切视图（<button>）：去掉下划线，外观与其它项一致 */
  a.nav-item { text-decoration: none; cursor: pointer; }
  .nav-item.active {
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .nav-item .ico { width: 16px; text-align: center; flex: none; opacity: .9; }
  .nav-item .badge {
    margin-left: auto; font-size: var(--fs-11); font-weight: 600;
    background: var(--err); color: #fff; border-radius: 999px;
    min-width: 17px; height: 17px; padding: 0 5px;
    display: none; place-items: center;
  }
  .nav-item .badge.show { display: grid; }
  .sidebar-foot {
    margin-top: auto; padding: 12px; border-top: 1px solid var(--border);
    font-size: var(--fs-11); color: var(--muted); line-height: 1.7;
  }
  .sidebar-foot .ver { color: var(--text-2); font-weight: 600; }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 18px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 30;
  }
  .conn {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: var(--fs-12); color: var(--text-2);
    background: var(--bg-sunk); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 11px 3px 9px; max-width: 100%;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .dot.off { background: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }
  .conn .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .grow { flex: 1; }

  .field-label { font-size: var(--fs-12); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }

  /* ---------- 表单控件 ---------- */
  input[type=text], input[type=number], input[type=password], select, textarea {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 5px 9px; font: inherit; font-size: var(--fs-13);
    transition: border-color .14s, box-shadow .14s;
  }
  /* mono 输入框：Key 值、模型 ID、token 数——等宽才看得出有没有多空格 */
  input.mono { font-family: var(--mono); font-size: var(--fs-12); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }

  /* ---------- 按钮 ---------- */
  button, .btn {
    background: var(--surface); color: var(--text-2);
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
    padding: 5px 11px; font-weight: 500; font-size: var(--fs-13);
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    transition: background .14s, border-color .14s, color .14s;
  }
  button:hover:not(:disabled), .btn:hover { border-color: var(--accent-border); color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  button.danger { color: var(--err); border-color: var(--err-border); }
  button.danger:hover:not(:disabled) { background: var(--err-soft); color: var(--err); border-color: var(--err); }
  button.mini { padding: 1px 9px; font-size: var(--fs-12); border-radius: 999px; line-height: 18px; }
  button.ghost { border-color: transparent; background: transparent; }
  button.ghost:hover:not(:disabled) { background: var(--bg-sunk); }


  /* ---------- 视图容器 ---------- */
  main { flex: 1; padding: 16px 18px 56px; width: 100%; }
  section.view { display: none; max-width: 1480px; margin: 0 auto; }
  section.view.active { display: block; }

  /* ---------- 页头 / 工具条 ---------- */
  .view-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .view-head h2 { font-size: var(--fs-20); }
  .view-head .desc { font-size: var(--fs-12); color: var(--muted); }
  .toolbar { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .filters {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }

  /* ---------- 卡片 / KPI ---------- */
  .grid { display: grid; gap: 12px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); margin-bottom: 16px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-card); padding: 13px 15px; box-shadow: var(--shadow-sm);
  }
  .kpi .k-label { font-size: var(--fs-12); color: var(--muted); margin-bottom: 5px; }
  /* KPI 数字用 20px 而非 24px：本控制台一屏 5~6 个 KPI，24px 会把标签
     挤成两行；20px 配 650 字重已足够抢占视线（参考站同级也是 20）。 */
  .kpi .k-value {
    font-size: var(--fs-20); font-weight: 650; line-height: 1.25; letter-spacing: -.2px;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .kpi .k-sub { font-size: var(--fs-12); color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .kpi.is-ok .k-value { color: var(--ok); }
  .kpi.is-warn .k-value { color: var(--warn); }
  .kpi.is-err .k-value { color: var(--err); }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-card); padding: 14px 16px; box-shadow: var(--shadow-sm);
  }
  .card > h3 { font-size: var(--fs-14); margin-bottom: 8px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); margin-bottom: 16px; }
  .prov-card .p-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .prov-card .p-name { font-weight: 650; font-size: var(--fs-13); }
  .prov-card .p-url {
    font-size: var(--fs-11); color: var(--muted); word-break: break-all;
    margin-bottom: 8px; line-height: 1.5;
  }
  .prov-card .p-models { font-size: var(--fs-12); color: var(--text-2); line-height: 1.7; }

  h4.sec {
    margin: 20px 0 9px; font-size: var(--fs-13); color: var(--text-2); font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  h4.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* ---------- 徽章 / 标签（胶囊化：状态是标签，不是按钮） ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 0 9px; border-radius: 999px; font-size: var(--fs-12); font-weight: 500;
    border: 1px solid transparent; white-space: nowrap; line-height: 18px;
  }
  .pill.green { color: var(--ok); border-color: var(--ok-border); background: var(--ok-soft); }
  .pill.red { color: var(--err); border-color: var(--err-border); background: var(--err-soft); }
  .pill.amber { color: var(--warn); border-color: var(--warn-border); background: var(--warn-soft); }
  .pill.gray { color: var(--neutral); border-color: var(--neutral-border); background: var(--neutral-soft); }
  .pill.blue { color: var(--accent); border-color: var(--accent-border); background: var(--accent-soft); }
  .chip {
    display: inline-block; background: var(--bg-sunk);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 0 7px; font-size: var(--fs-11); color: var(--text-2); margin: 1px 3px 1px 0;
    line-height: 17px;
  }
  .rank {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; padding: 0 5px; border-radius: 6px;
    font-family: var(--mono); font-size: var(--fs-11); font-weight: 650;
    font-variant-numeric: tabular-nums; line-height: 17px;
    background: var(--bg-sunk); border: 1px solid var(--line); color: var(--muted);
  }
  .rank.rank-1 { color: var(--rank-1); border-color: var(--rank-1); }
  .rank.rank-2 { color: var(--rank-2); border-color: var(--rank-2); }
  .rank.rank-3 { color: var(--rank-3); border-color: var(--rank-3); }


  /* ---------- 表格（本控制台的主体，按 aihot 排行榜的密度做） ---------- */
  .tablewrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); overflow: auto; max-height: 68vh;
    box-shadow: var(--shadow-sm);
  }
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-13); }
  thead th {
    text-align: left; padding: 8px 12px; color: var(--muted);
    font-weight: 600; font-size: var(--fs-12); white-space: nowrap;
    border-bottom: 1px solid var(--line-strong);
    background: var(--bg-sunk); position: sticky; top: 0; z-index: 1;
  }
  tbody td {
    padding: 7px 12px; border-bottom: 1px solid var(--line);
    white-space: nowrap; vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg-sunk); }
  tbody.clickable { cursor: pointer; }
  /* 数字一律等宽 + 右对齐：一列数字竖着扫才比得了大小（参考站 188 处 mono 的理由） */
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.mono, th.mono { font-family: var(--mono); font-size: var(--fs-12); }
  .ell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  /* 主键列（模型 / 别名 / 凭据名）允许换行，别为它撑出横向滚动 */
  td.name { white-space: normal; word-break: break-all; min-width: 168px; }
  td.name .sub { display: block; font-size: var(--fs-11); color: var(--muted);
                 margin-top: 2px; line-height: 1.6; }
  td.acts, th.acts {
    position: sticky; left: 0; z-index: 2;
    background: var(--surface); border-right: 1px solid var(--line);
    text-align: right; white-space: nowrap; padding: 7px 10px;
  }
  /* 主键列（模型 / 别名 / 凭据名）允许换行，别为它撑出横向滚动 */
  td.name { white-space: normal; word-break: break-all; min-width: 168px; }
  td.name .sub { display: block; font-size: var(--fs-11); color: var(--muted);
                 margin-top: 3px; line-height: 1.6; }
  /* 操作列固定在最左侧：宽表右滑时按钮永远在手边，不用先滚到底 */
  th.acts, td.acts {
    position: sticky; left: 0; z-index: 2;
    background: var(--surface); border-right: 1px solid var(--border);
    text-align: right; white-space: nowrap;
  }
  thead th.acts { z-index: 3; }
  tbody tr:hover td.acts { background: var(--bg-sunk); }
  td.acts .row-flex { justify-content: flex-end; gap: 4px; }
  td.acts .cell-id { display: inline-flex; align-items: center; gap: 5px; }
  td.acts .cell-id b { font-weight: 600; }
  td.cell-sub { color: var(--muted); font-size: var(--fs-11); max-width: 150px;
                overflow: hidden; text-overflow: ellipsis; }
  td.acts button { margin: 0; }
  /* 次要操作列（删除）钉在最右侧，和左側编辑形成一组 */
  th.acts-end, td.acts-end {
    position: sticky; right: 0; z-index: 2;
    background: var(--surface); border-left: 1px solid var(--border);
    text-align: center;
  }
  td.acts-end:empty { padding: 0; border-left: none; width: 0; }
  thead th.acts-end { z-index: 3; }
  tbody tr:hover td.acts-end { background: var(--bg-sunk); }

  /* ---------- 需要处理 ---------- */
  .attention {
    border: 1px solid var(--warn-border); border-left: 3px solid var(--warn);
    background: var(--warn-soft); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 16px;
  }
  .attention.is-err { border-color: var(--err-border); border-left-color: var(--err); background: var(--err-soft); }
  .attention h3 {
    font-size: var(--fs-13); margin-bottom: 9px; display: flex; align-items: center; gap: 7px;
  }
  .attention .att-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 0; border-top: 1px solid var(--border);
    font-size: var(--fs-13);
  }
  .attention .att-row:first-of-type { border-top: none; }
  .attention .att-msg { flex: 1; min-width: 220px; }
  .attention .att-ico { flex: none; }
  /* 「📋 怎么补」展开的命令块：要能整段选中复制，所以用 pre 且不截断 */
  .attention .att-fix {
    margin: 2px 0 8px; padding: 8px 10px; border-radius: 8px;
    background: var(--bg-sunk);
    border: 1px solid var(--border);
  }
  .attention .att-fix pre {
    margin: 0 0 6px; white-space: pre-wrap; word-break: break-all;
    font-family: var(--mono, ui-monospace, monospace); font-size: var(--fs-11);
    user-select: all;
  }
  .attention .att-fix p { margin: 0; }
  .attention .att-fix code { font-size: var(--fs-11); }
  .attention .empty { font-size: var(--fs-13); color: var(--text-2); }
  /* 按别名表格的病态行：io 比超阈值时整行着色，不用读数字就知道该看哪条链 */
  tbody tr.is-warn { background: var(--warn-soft); }
  tbody tr.is-bad { background: var(--err-soft); }
  .attention.is-warn { border-color: var(--warn-border); border-left-color: var(--warn); background: var(--warn-soft); }

  /* ---------- 配置表单（消耗器页） ---------- */
  .cfg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 14px; }
  .cfg-grid .field { display: flex; flex-direction: column; gap: 5px; font-size: var(--fs-12); color: var(--text-2); }
  .cfg-grid .field input, .cfg-grid .field textarea {
    font: inherit; font-size: var(--fs-13); color: var(--text); background: var(--bg-sunk);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 9px; resize: vertical;
  }
  .cfg-grid .field input:focus, .cfg-grid .field textarea:focus { outline: none; border-color: var(--accent); }
  .tag {
    display: inline-block; font-size: var(--fs-11); padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-2); background: var(--bg-sunk);
  }
  .tag.is-ok { color: var(--ok); border-color: var(--ok-border, var(--border)); background: var(--ok-soft); }
  .tag.is-warn { color: var(--warn); border-color: var(--warn-border, var(--border)); background: var(--warn-soft); }
  .tag.is-err { color: var(--err); border-color: var(--err-border, var(--border)); background: var(--err-soft); }

  /* ---------- 抽屉 ---------- */
  /* 底部 Tab 只属于手机：桌面上侧边导航才是主导航，这个要隐藏。 */
  #mnav { display: none; }

  #drawer {
    position: fixed; top: 0; right: 0; height: 100vh; width: min(700px, 94vw);
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    transform: translateX(105%); transition: transform .2s ease;
    z-index: 40; overflow: auto; padding: 18px 20px 40px;
  }
  #drawer.open { transform: none; }
  #drawer .dr-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    position: sticky; top: -18px; background: var(--surface);
    padding: 12px 0 10px; margin-top: -18px; z-index: 2;
    border-bottom: 1px solid var(--border);
  }
  #drawer .dr-head h2 { font-size: var(--fs-15); flex: 1; }
  dl.detail {
    display: grid; grid-template-columns: 118px 1fr; gap: 6px 12px;
    font-size: var(--fs-13); margin: 0 0 16px;
  }
  dl.detail dt { color: var(--muted); }
  dl.detail dd { margin: 0; word-break: break-all; white-space: normal; }
  .bar { height: 7px; background: var(--bg-muted); border-radius: 4px; overflow: hidden; min-width: 60px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

  /* ---------- Toast ---------- */
  #toasts {
    position: fixed; right: 18px; bottom: 18px; display: flex;
    flex-direction: column; gap: 8px; z-index: 60; max-width: calc(100vw - 36px);
  }
  .toast {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: var(--radius);
    padding: 10px 14px; max-width: 420px; font-size: var(--fs-13);
    box-shadow: var(--shadow-md); animation: toast-in .18s ease;
  }
  .toast.err { border-left-color: var(--err); }
  .toast.ok { border-left-color: var(--ok); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- 弹窗 ---------- */
  /* 2026-09-30：七个弹窗原本共用同一个 z-index（55），于是「谁盖住谁」只由
     DOM 顺序决定——子弹窗若写在父弹窗前面就会被压住，运营者的体验是
     「点了没反应」。三个真实症状同源：
       新建供应商 → 保存：该弹出的「加 Key」被供应商列表盖住；
       模型市场 → ＋ 添加：预填好的模型表单被市场列表盖住；
     层级现在按树分层写在这里（子永远高于父），另配 JS 的 closeModals()
     保证同一时刻只留一层遮罩。新增弹窗时挑一级加一行即可，不用再算顺序。 */
  #auth { z-index: 70; }                                  /* 令牌失校验必须压住一切 */
  .modal-mask { z-index: 55; }
  /* 被唤起的孩子（父 → 子：父关了才轮到它们） */
  #model-modal, #alias-modal, #limits-modal { z-index: 56; }
  /* 唤起者（在市场/供应商/凭据池里点开） */
  #market-modal, #addkey-modal, #chatgpt-modal { z-index: 57; }
  /* 供应商管理本身也是唤起者，要在凭据池之上 */
  #providers-modal { z-index: 58; }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .42);
    display: none; align-items: flex-start; justify-content: center;
    backdrop-filter: blur(2px); overflow: auto; padding: 40px 14px;
  }
  .modal-mask.show { display: flex; }
  .modal-mask .card { width: min(780px, 94vw); box-shadow: var(--shadow-lg); }
  .modal-mask .card.wide { width: min(980px, 96vw); }
  .modal-mask h3 {
    font-size: var(--fs-15); margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
  }
  /* 弹窗右上角关闭钮：标题是 flex 行，✕ 推到最右 */
  .modal-mask h3 .modal-x { margin-left: auto; flex: none; }
  .modal-mask .modal-sub { font-size: var(--fs-12); color: var(--muted); margin-bottom: 14px; line-height: 1.7; }
  .formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 11px 14px; }
  .formgrid label { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-12); color: var(--muted); }
  .formgrid label.wide { grid-column: 1 / -1; }
  .formgrid input, .formgrid select, .formgrid textarea { width: 100%; }
  .formgrid .hint { font-size: var(--fs-11); color: var(--muted); line-height: 1.6; }
  /* 接口模型开关：一个真正的 switch，不是 checkbox——「越过首位」是个状态，
     不是一次勾选，视觉上要能一眼看出当前是开还是关。 */
  .fmrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fmswitch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .fmswitch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .fmtrack {
    width: 38px; height: 21px; border-radius: 11px; background: var(--border);
    transition: background .16s ease; flex: none; position: relative;
  }
  .fmtrack::after {
    content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: transform .16s ease;
    box-shadow: 0 1px 3px rgba(0,0,0,.28);
  }
  .fmswitch input:checked + .fmtrack { background: var(--accent, #4b8bff); }
  .fmswitch input:checked + .fmtrack::after { transform: translateX(17px); }
  .fmswitch input:focus-visible + .fmtrack { outline: 2px solid var(--accent, #4b8bff); outline-offset: 2px; }
  .fmlabel { font-size: var(--fs-12); color: var(--muted); }
  .fmlabel b { color: var(--text); font-weight: 600; }
  .modal-actions {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .capgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px 12px; }
  .capgrid label { display: flex; flex-direction: column; gap: 3px; font-size: var(--fs-12); color: var(--muted); }
  .dep-card {
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 12px; margin-top: 9px; background: var(--bg-sunk);
  }
  .dep-card .row-flex { margin-bottom: 7px; }
  .facts-card {
    border: 1px solid var(--accent); border-radius: var(--radius-sm);
    padding: 11px 13px; margin-bottom: 14px; background: var(--accent-soft);
  }
  .facts-card .f-title { font-size: var(--fs-13); font-weight: 600; margin-bottom: 8px; }

  /* ---------- 令牌弹窗 ---------- */
  #auth {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .42);
    display: none; align-items: center; justify-content: center;
    z-index: 50; backdrop-filter: blur(3px); padding: 20px;
  }
  #auth.show { display: flex; }
  #auth .card { width: 440px; max-width: 94vw; box-shadow: var(--shadow-lg); }
  #auth .card h3 { font-size: var(--fs-15); margin-bottom: 8px; }
  #auth input { width: 100%; margin: 12px 0; }
  #auth .row-flex { margin-top: 6px; }

  .row-flex { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: var(--fs-12); }
  .tiny { font-size: var(--fs-11); }
  .ok-text { color: var(--ok); }
  .warn-text { color: var(--warn); }
  .err-text { color: var(--err); }
  .strong { font-weight: 600; }
  .note-block {
    font-size: var(--fs-12); color: var(--text-2); line-height: 1.8;
    background: var(--bg-sunk); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 12px;
  }
  details.raw { font-size: var(--fs-12); color: var(--muted); margin-top: 8px; }
  details.raw summary { cursor: pointer; user-select: none; }
  details.raw pre {
    white-space: pre-wrap; word-break: break-all; margin: 8px 0 0;
    background: var(--bg-sunk); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px; max-height: 320px; overflow: auto;
  }
  hr.sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* ================================================================
     窄屏（手机）信息架构

    案例展示：左侧导航 + 001/003/005 三列卡片，手机上每个卡片仍然一行三个。
     只有 390px 的屏幕：内容区一屏一个视图，底部是四个指纹可及的 Tab；
     表格全部变成卡片堆叠（每行一张卡，字段名显示在值的左侧），
     所以不再需要横向拖动。
     ================================================================ */
  @media (max-width: 860px) {
    /* ---- 1. 框架：侧栏隐藏，底部 Tab 接管 ---- */
    .app { flex-direction: column; }
    .sidebar { display: none !important; }
    .content { min-width: 0; }
    main { padding: 12px 12px 76px; }
    section.view { max-width: none; }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      padding: 8px 12px; gap: 6px; flex-wrap: wrap;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .topbar .conn { order: -1; flex: 1 1 100%; }
    .topbar #quarantine-banner { flex: 1 1 100%; }
    .topbar label.field-label { display: none; }
    .topbar .grow { display: none; }
    /* 按钮改成四个":名称 + 图标仍然在，但占据更小可点 */
    .topbar button { flex: 1 1 auto; min-width: 0;
      padding: 6px 8px; font-size: var(--fs-12); }

    /* ---- 2. 底部 Tab 栏 ---- */
    #mnav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    #mnav a {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 7px 2px 6px; font-size: 11px; color: var(--muted);
      text-decoration: none; border-radius: 0;
    }
    #mnav a .ico { font-size: 17px; line-height: 1; }
    #mnav a.on { color: var(--accent-ink); background: var(--accent-soft); }


    /* ---- 3. 卡片合并：多列 KPI → 两列，配置表单 → 单列 ---- */
    .grid.kpis, .cfg-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .formgrid { grid-template-columns: minmax(0, 1fr); }
    .grid.kpis .kpi, .cfg-grid .field { min-width: 0; }
    /* 手机 KPI 只留前两个最关键的（账号数、目标池），其余次要指标折叠 */
    .grid.kpis .kpi:nth-child(n+3) { display: none; }
    .kpi .k-value { font-size: var(--fs-15); overflow-wrap: anywhere; }
    .kpi .k-sub { font-size: var(--fs-11); overflow-wrap: anywhere; }

    /* ---- 4. 表格 → 卡片堆叠（核心） ---- */
    /* 表格卡片化后不应该再横向滚动，但要截断子元素的溢出——
       否则一个写死宽度的 td 依然会把视图撑开。 */
    .tablewrap { overflow: hidden; border: none; }
    .tablewrap table, .tablewrap table.small { display: block; width: 100%; }
    .tablewrap thead { display: none; }
    .tablewrap tbody { display: block; }
    .tablewrap tbody tr {
      display: grid; grid-template-columns: minmax(0, 1fr);
      gap: 1px; padding: 10px 11px;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--panel); margin-bottom: 9px;
      box-shadow: var(--shadow-sm);
    }
    .tablewrap tbody td {
      display: flex; align-items: baseline; gap: 9px;
      padding: 2px 0; border: none; min-width: 0;
      font-size: var(--fs-13); text-align: left;
    }
    /* td 是 flex 容器，子元素默认不会收缩到小于 min-content（
       那个 392px 的 modelscope → deepseek-ai/... 块就是这样把视图撑开的）。
       所有 flex 子项都要 min-width: 0 + 允许断行。 */
    .tablewrap tbody td > * { min-width: 0; }
    .tablewrap tbody td > div { flex: 1 1 auto; }
    .tablewrap tbody td .chip { white-space: normal; }
    /* 字段名自动插在值前面 */
    .tablewrap tbody td::before {
      content: attr(data-label);
      flex: none; width: 4.9em;
      color: var(--muted); font-size: var(--fs-11);
      line-height: 1.6; text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .tablewrap tbody td[data-label=""]::before { display: none; }    /* 每张卡的第一个字段（通常是身份：凭证 / 模型 / 别名）要突出，
       否则 16 张卡看起来全一样，运营者得一行行扫。 */
    .tablewrap tbody td:first-child {
      font-size: var(--fs-13); padding-bottom: 4px; margin-bottom: 3px;
      border-bottom: 1px dashed var(--border);
    }
    .tablewrap tbody td:first-child::before {
      width: 4.9em; color: var(--text-2); font-weight: 600;
    }

    /* 进度条：Sketch绘制时用的内联 px 宽度在手机上会把单元格撑开，
       这里改为流式（占满剩余空间，长度由 i 的宽度表达）。 */
    .tablewrap tbody td .bar { width: auto !important; flex: 1 1 auto; min-width: 0; }
    /* 部署链、链路这类“modelscope → deepseek-ai/...”的长串：
       箭头和 / 不产生断行机会，手机上会把单元格撑开 400+px。
       这里允许在任意字符之间断行（只影响手机）。 */
    /* 长串（部署链 / 解析结果 / 链路）在手机上必须能断行，
       否则一个单词就把整个视图撑开几百 px。
       break-all 而不是 break-word：后者在“modelscope → deepseek-ai/...”
       这种没有空格的长串上仍然不断行。 */
    .tablewrap tbody td { overflow-wrap: anywhere; word-break: break-all; }
    .tablewrap tbody td * { overflow-wrap: anywhere; word-break: break-all; }
    .tablewrap table { table-layout: fixed; }

    .row-flex { flex-wrap: wrap; min-width: 0; }
    .row-flex > .small { white-space: nowrap; }

    .ell { max-width: none; }
    td.cell-sub { max-width: none; }
    /* 操作列：一字排开，不要一堆小按钮挤在一行 */
    .tablewrap tbody td.acts { padding-top: 6px; margin-top: 4px;
      border-top: 1px dashed var(--border); flex-wrap: wrap; gap: 6px; }
    .tablewrap tbody td.acts::before { width: 100%; }
    .tablewrap tbody td.acts button { flex: 1 1 auto; min-width: 72px; }

    /* 校验与输入的单元格不要被 5.6em 标签挤缩 */
    .tablewrap tbody td:has(input, select, textarea, button:only-child) {
      display: block;
    }
    .tablewrap tbody td:has(input, select, textarea, button:only-child)::before {
      display: inline-block; width: auto; margin-right: 6px;
    }
    .tablewrap tbody td:has(input, select, textarea) input,
    .tablewrap tbody td:has(input, select, textarea) select { width: 100%; }


    /* ---- 5. 对话框抽屉：成为全屏 ---- */
    .modal-mask { padding: 0; align-items: stretch; }
    .modal-mask .card, .modal-mask .card.wide {
      width: 100%; min-height: 100%; border-radius: 0;
      border: none; padding: 14px 14px 20px;
    }
    .modal-mask .card.wide { width: 100%; }
    /* 弹窗标题吸顶：长表单滚动时 ✕ 关闭按钮始终可见 */
    .modal-mask .card > h3 {
      position: sticky; top: 0; z-index: 3;
      background: var(--panel);
      padding: 6px 0; margin-top: -6px;
    }
    /* 配置片段代码块：手机上别占 280px 满屏，长串允许断行不外溢 */
    #cg-snippet { max-height: 180px; overflow-wrap: anywhere; word-break: break-all; white-space: pre-wrap; }
    #auth .card { width: 100%; max-width: none; }
    #toasts { left: 12px; right: 12px; align-items: stretch; }
    .toast { max-width: none; }
    #drawer { width: 100vw; max-width: 100vw; }
    #mnav { max-width: 100vw; }
    #toasts { max-width: calc(100vw - 24px); }
    .modal-mask { max-width: 100vw; overflow: auto; }
    .modal-mask .card, .modal-mask .card.wide { max-width: 100vw; }

    /* ---- 6. 日志、预览与字体 ---- */
    #bl-log { height: 220px; font-size: 11px; }
    .note { font-size: var(--fs-12); }
    .view-head h2 { font-size: var(--fs-16); }
    .view-head .desc { font-size: var(--fs-12); }
    h4.sec { font-size: var(--fs-13); margin-top: 18px; }
    pre { font-size: 11px; }
    /* 默认字体去限，防止 iOS 自动放大 */
    body { -webkit-text-size-adjust: 100%; }

    /* ============================================================
       手机上把长页面改成「手风琴」：一次只展开一个片段。
       消耗器页 3500+px，全展开时运营者得滚半天才找得到想要的那一节。
       ============================================================ */
    .msec { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); margin-bottom: 9px; overflow: hidden; }
    .msec > .msec-head {
      display: flex; align-items: center; gap: 9px; width: 100%;
      padding: 12px 13px; background: none; border: none; text-align: left;
      font: inherit; color: var(--text); cursor: pointer;
    }

<script>
"use strict";
/* ================= 基础工具 ================= */
const $ = sel => document.querySelector(sel);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* ================= 手机版 Tab 栅 + 抽屉 =================
 * 手机上靠下面四个指可及的 Tab + 抽屉（“更多”）转站；
 * Tab 由 JS 从现有导航派生，不另写一份清单。
 * 表格里每个 td 打上 data-label 后交给 CSS 排版，JS 只负责打标签。
 * ==================================================================== */
const MNAV = [
  { view: "overview", ico: "📊", label: "总览" },
  { view: "models",   ico: "🧩", label: "模型" },
  { view: "burner",   ico: "🔥", label: "消耗器" },
  { view: "more",     ico: "•••", label: "更多" },
];

function mnavBuild() {
  const bar = $("#mnav");
  if (!bar) return;
  bar.innerHTML = MNAV.map(m =>
    `<a href="javascript:void 0" data-mnav="${m.view}"><span class="ico">${m.ico}</span>${m.label}</a>`
  ).join("");
  bar.querySelectorAll("a[data-mnav]").forEach(a => {
    a.onclick = () => {
      const v = a.dataset.mnav;
      if (v === "more") { mnavMore(); return; }
      switchView(v);
    };
  });
}

function mnavPanel(html) {
  const d = $("#drawer");
  if (!d) return;
  d.innerHTML = html;
  d.classList.add("open");
}

function mnavClose() {
  const d = $("#drawer");
  if (d) d.classList.remove("open");
}

function mnavMore() {
  // 「更多」抽：桌面侧栏的其余入口，一行一个，挤指够得到
  const items = [
    { view: "pool", ico: "🔑", label: "凭证池" },
    { view: "requests", ico: "📨", label: "请求记录" },
    { view: "usage", ico: "📈", label: "用量统计" },
    { href: "/ui/report", ico: "🏥", label: "健康报告" },
    { href: "/ui/agent", ico: "🤖", label: "Agent 任务台" },
  ];
  const rows = items.map(m => {
    const attrs = m.href ? `href="${m.href}"` : `href="javascript:void 0" data-go="${m.view}"`;
    return `<a class="mnav-row" ${attrs}><span class="ico">${m.ico}</span>`
      + `<span class="grow" style="text-align:left">${m.label}</span><span class="muted">›</span></a>`;
  }).join("");
  mnavPanel(`<div class="dr-head"><h2 class="grow">更多</h2>`
    + `<button class="mini" id="mnav-close">✕ 关闭</button></div>`
    + `<div class="mnav-list">${rows}</div>`);
  const closeBtn = $("#mnav-close");
  if (closeBtn) closeBtn.onclick = mnavClose;
  document.querySelectorAll("#drawer a[data-go]").forEach(a => {
    a.onclick = () => { mnavClose(); switchView(a.dataset.go); };
  });
}

function mnavSync() {
  const bar = $("#mnav");
  if (!bar) return;
  bar.querySelectorAll("a[data-mnav]").forEach(a => {
    a.classList.toggle("on", a.dataset.mnav === state.view);
  });
}

/** 手机上把长页面改成手风琴：每个 h4.sec 开头的片段包成可折叠的一块。

    消耗器页 3500+px，全展开时运营者得滚半天才找得到想要的那一节。
    默认展开第一个（通常是状态/总览），其余折起来。
*/
function accordionSections(root) {
  if (!window.matchMedia("(max-width: 860px)").matches) return;
  const scope = root || document;
  scope.querySelectorAll("section.view h4.sec").forEach((h) => {
    if (h.dataset.acc === "1") return;
    h.dataset.acc = "1";
    // 默认展开「这个视图里的第一个」而不是全站第一个：
    // forEach 索引跨所有 section，用它判断会让后面几个视图永远折起。
    const view = h.closest("section.view");
    const isFirst = view && view.querySelector("h4.sec") === h;
    // 收集这个 h 之后、下一个 h4.sec 之前的所有兄彆
    const body = [];
    let n = h.nextElementSibling;
    while (n && !(n.tagName === "H4" && n.classList.contains("sec"))) {
      body.push(n);
      n = n.nextElementSibling;
    }
    if (!body.length) return;
    const sec = document.createElement("div");
    sec.className = "msec" + (isFirst ? " open" : "");
    h.parentNode.insertBefore(sec, h);
    sec.innerHTML = `<button class="msec-head" type="button">
        <span class="msec-ico">📎</span>
        <span class="msec-title">${esc(h.textContent || "")}</span>
        <span class="msec-arrow">›</span>
      </button><div class="msec-body"></div>`;
    const hold = sec.querySelector(".msec-body");
    body.forEach(el => hold.appendChild(el));
    sec.querySelector(".msec-head").onclick = () => sec.classList.toggle("open");
  });
}

/** 给表格里每个 td 打上 data-label（取自 thead 的 th）。
 *  已经有的不覆盖：那些是 JS 自己写好的更明确的名字。 */
function tableCards() {
  if (window.matchMedia("(max-width: 860px)").matches === false) return;
  document.querySelectorAll(".tablewrap table").forEach(table => {
    const heads = [...table.querySelectorAll("thead th")].map(th =>
      (th.textContent || "").trim());
    if (!heads.length) return;
    [...table.querySelectorAll("tbody tr")].forEach(tr => {
      [...tr.children].forEach((td, i) => {
        if (!(td instanceof HTMLTableCellElement)) return;
        if (td.dataset.label !== undefined) return;
        td.dataset.label = heads[i] || "";
      });
    });
  });
}

const state = {
  view: "overview",
  token: localStorage.getItem("zkai_admin_token") || "",
  timer: null,
  poolAt: 0,
  req: { offset: 0, size: 50, total: 0 },
  providers: [],
  usageDays: 7,
};

function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/** DB 时间戳是「无时区 UTC」——补上 Z 再按本地时区展示。 */
function fmtTime(iso) {
  if (!iso) return "-";
  let s = String(iso);
  if (s.includes("T") && !/([Zz]|[+-]\d\d:?\d\d)$/.test(s)) s += "Z";
  const d = new Date(s);
  if (isNaN(d)) return s;
  // 今天以内只显小时分秒（省空间），超过就带日期——
  // 否则手机上看到一个 10:44:41 完全无法判断是否过期。
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const opts = {
    hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit",
  };
  if (!sameDay) { opts.month = "numeric"; opts.day = "numeric"; }
  return d.toLocaleString("zh-CN", opts);
}
function fmtEpoch(ts) {
  if (!ts) return "-";
  return new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false });
}
function ago(iso) {
  let s = String(iso || "");
  if (s.includes("T") && !/([Zz]|[+-]\d\d:?\d\d)$/.test(s)) s += "Z";
  const d = new Date(s); if (isNaN(d)) return "-";
  const sec = Math.max(0, (Date.now() - d.getTime()) / 1000);
  if (sec < 60) return Math.round(sec) + " 秒前";
  if (sec < 3600) return Math.round(sec / 60) + " 分钟前";
  if (sec < 86400) return (sec / 3600).toFixed(1) + " 小时前";
  return (sec / 86400).toFixed(1) + " 天前";
}
function num(n) { return (n ?? 0).toLocaleString("zh-CN"); }
function pct(v) { return v == null ? "-" : (v * 100).toFixed(1) + "%"; }
function dur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.floor(sec / 60) + "m" + (sec % 60 ? (sec % 60) + "s" : "");
  return Math.floor(sec / 3600) + "h" + Math.floor((sec % 3600) / 60) + "m";
}
const STATUS_PILL = {
  healthy: ["green", "正常"], cooldown: ["amber", "冷却"],
  unhealthy: ["red", "异常"], disabled: ["gray", "禁用"],
  success: ["green", "成功"], error: ["red", "失败"],
  cancelled: ["gray", "取消"], pending: ["blue", "进行中"],
};
/** 已同步到 YAML 文件时告诉用户写到了哪里；模板模式（无本地文件）时提醒。 */
function syncedNote(resp) {
  const s = resp && resp.synced;
  if (s) return `（已同步 ${s}）`;
  if (s === null) return "（模板模式：只存数据库，未改文件）";
  return "";
}
/* ================= 弹窗基座（唯一出入口） ================= */
/*
 * 2026-09-30：修两个「点了没反应」——新建供应商后不自动进入加 Key、模型市场
 * 点添加没反应。根因是七个 .modal-mask 原本共用一个 z-index（55），谁在上层
 * 只看 DOM 顺序；子弹窗（#addkey-modal / #model-modal）写在父弹窗
 * （#providers-modal / #market-modal）**前面**，于是打开后立刻被盖住。
 *
 * 现在两层防护，缺一不可：
 *   ① CSS：按父子关系分层（见 .modal-mask 附近的注释）；
 *   ② JS：openModal 打开子弹窗前先关掉其它遮罩，绝不留两层。
 * ② 是必须的：只靠 ① 会得到「两层半透明遮罩叠着」的界面——能点了，但看不清，
 * 且关掉外层后里层还在，运营者以为没关干净。
 *
 * 用法：openModal("#addkey-modal") / closeModal("#addkey-modal")，
 * 不要再去写 classList.add("show")。
 */
const MODAL_IDS = [
  "#model-modal", "#alias-modal", "#limits-modal", "#market-modal",
  "#addkey-modal", "#providers-modal", "#chatgpt-modal", "#auth",
];
/** 打开一个弹窗，并关掉其它所有遮罩（父弹窗由调用方负责收尾）。 */
function openModal(sel) {
  const target = $(sel);
  if (!target) return;
  MODAL_IDS.filter(id => id !== sel).forEach(id => {
    const el = $(id);
    if (el) el.classList.remove("show");
  });
  target.classList.add("show");
}
/** 关掉除 keep 以外的全部弹窗；keep 通常传正在展示的那个，避免误伤。 */
function closeModals(keep) {
  MODAL_IDS.filter(id => id !== keep).forEach(id => {
    const el = $(id);
    if (el) el.classList.remove("show");
  });
}
function closeModal(sel) {
  const el = $(sel);
  if (el) el.classList.remove("show");
}

function pill(status) {
  const [cls, label] = STATUS_PILL[status] || ["gray", status || "-"];
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}
function rankBadge(n) {
  const k = n === 1 ? "rank-1" : n === 2 ? "rank-2" : n === 3 ? "rank-3" : "rank-rest";
  return `<span class="rank ${k}">${n}</span>`;
}


async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers);
  if (state.token) headers["X-Admin-Token"] = state.token;
  if (opts.json !== undefined) {
    headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.json);
  }
  const resp = await fetch(path, Object.assign({}, opts, { headers }));
  if (resp.status === 401) { showAuth(); throw new Error("管理令牌无效或缺失，请重新粘贴令牌"); }
  let data = null;
  try { data = await resp.json(); } catch { /* 无 body */ }
  if (!resp.ok) {
    const msg = data && data.error && data.error.message
      ? data.error.message : (data && data.detail && data.detail.error
        ? data.detail.error.message : "HTTP " + resp.status);
    throw new Error(path + " → " + msg);
  }
  return data;
}

/* ================= 视图注册 ================= */
const LOADERS = {
  overview: loadOverview, pool: loadPool, requests: loadRequests,
  usage: loadUsage, models: loadModels, burner: loadBurner,
};
function switchView(name) {
  if (state.view === "burner" && name !== "burner") blStop();
  state.view = name;
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.view === name));
  document.querySelectorAll("section.view").forEach(s =>
    s.classList.toggle("active", s.id === "view-" + name));
  refresh();
}
async function refresh() {
  const fn = LOADERS[state.view];
  if (!fn) return;
  try { await fn(); }
  catch (err) { toast(err.message, "err"); }
  // 手机上把表格变卡片：每次重绘后表格都是新的，标签要重打
  tableCards();
  accordionSections();
  mnavSync();
}
function setupTimer() {
  clearInterval(state.timer);
  const sec = Number($("#auto-interval").value);
  if (sec > 0) state.timer = setInterval(refresh, sec * 1000);
}
setInterval(tickCountdowns, 1000);
function tickCountdowns() {
  document.querySelectorAll("[data-cd-until]").forEach(el => {
    const left = Number(el.dataset.cdUntil) - Date.now() / 1000;
    if (left <= 0) { el.textContent = "已到期"; el.className = "muted"; }
    else { el.textContent = dur(left); el.className = "small" ; el.style.color = "var(--warn)"; }
  });
}

/* ================= 总览 ================= */
/* “需要处理”面板：把配置层面的坏味道直接摊在首页，每行带一个一键修复动作。
   判断只用 /health 与 /admin/providers 已经给出的字段，不做额外请求。 */
function attentionPanel(providers, warnings, config) {
  const cfg = config || {};
  const rows = [];
  (providers || []).forEach(p => {
    if (!p.enabled) return;
    const creds = p.credentials || [];
    if (p.requires_credential && !creds.length) {
      rows.push({
        level: "err", pid: p.id,
        msg: `${p.id} 还没有任何 Key——请求永远走不到它`,
        fix: "key", label: "➕ 去加 Key",
      });
      return;
    }
    const noSecret = creds.filter(c => c.secret_source === "missing");
    const keyProblem = (p.requires_credential && !creds.length) || noSecret.length;
    if (noSecret.length) {
      rows.push({
        level: "err", pid: p.id,
        msg: `${p.id} 有 ${noSecret.length} 把 Key 没配上实际值（${noSecret
          .slice(0, 2).map(c => esc(c.secret_ref || c.id)).join("、")}${noSecret.length > 2 ? " 等" : ""} 在 .env 里是空的）`,
        fix: "key", label: "✏️ 去填 Key",
      });
    }
    if (!(p.models || []).length) {
      rows.push({
        level: "warn", pid: p.id,
        msg: `${p.id} 一个模型都没挂上——它能调，但没有任何模型走它`,
        fix: "model", label: "🧺 去模型市场挑",
      });
    }
    // 可用性只在“Key 层面没问题”时补充：没配 Key 的供应商已经报过了，
    // 再说一遍“都在冷却”只是同一件事的第二副面孔。
    if (!keyProblem && creds.length && (p.models || []).length && !p.available) {
      const off = creds.filter(c => c.status === "cooldown" || c.status === "disabled" || !c.enabled).length;
      if (off === creds.length) {
        rows.push({
          level: "warn", pid: p.id,
          msg: `${p.id} 的全部 ${creds.length} 把 Key 都在冷却/禁用中，暂时不可用`,
          fix: "warm", label: "🔥 清冷却",
        });
      }
    }
  });
  (warnings || []).forEach(w => rows.push({ level: "warn", msg: `配置警告：${esc(w)}` }));
  // 凭据要读的 Key 不在 .env 里：本机好用，换机会静默丢掉。这条以前无处显示，
  // 只有跑 scripts/check_config.py 才知道——2026-09-29 就在这台机器上抓到一把。
  const gaps = cfg.credential_env_gaps || {};
  const gapRows = Object.entries(gaps).map(([name, ids]) => ({
    level: "warn", fix: "envgap", name, label: "📋 怎么补",
    msg: `${esc((ids || []).join("、"))} 读的 ${esc(name)} 不在 .env 里` +
      "——本机能用，但迁移包只带 .env，换机会丢这把 Key",
    // 直接从 OS 环境变量里取值，全程不回显；改 .env 前先备份
    cmd: [
      `$v=[Environment]::GetEnvironmentVariable("${esc(name)}","User")`,
      `if (-not $v) { $v=[Environment]::GetEnvironmentVariable("${esc(name)}","Machine") }`,
      `Add-Content -Path .env -Value "${esc(name)}=$v"`,
    ].join("\n"),
  }));
  rows.push(...gapRows);
  if (!rows.length) return "";

  const worst = rows.reduce((acc, r) =>
    (acc === "err" || r.level === "err") ? "err" : acc, rows[0].level);
  const ico = { err: "⛔", warn: "⚠️", ok: "✅" }[worst] || "⚠️";
  return `<div class="attention${worst === "err" ? " is-err" : ""}">
    <h3>${ico} 需要处理（${rows.length}）</h3>
    ${rows.map((r, i) => `<div class="att-row">
      <span class="att-ico">${r.level === "err" ? "⛔" : "⚠️"}</span>
      <span class="att-msg">${r.msg}</span>
      ${r.fix === "warm"
        ? `<button class="mini" data-fix="warm">🔥 清冷却</button>`
        : `<button class="mini primary" data-fix="${r.fix}" data-pid="${esc(r.pid || "")}">${r.label}</button>`}
    </div>${r.cmd
      ? `<div class="att-fix" id="att-fix-${i}" hidden>
           <pre>${r.cmd}</pre>
           <p class="muted">值从 OS 环境变量里取，全程不回显；改 .env 前先备份，
             改完跑一次 <code>scripts\\check_config.py</code> 确认这条警告消失。</p>
         </div>`
      : ""}`).join("")}
  </div>`;
}

function renderServerLine(health) {
  const dep = health.deploy || {};
  const bits = [
    `${health.app} v${health.version}`,
    `数据库 ${health.database.ok ? "正常" : "异常"}`,
    `已运行 ${dur(health.uptime_seconds)}`,
  ];
  // 部署在服务器上时把入口形态说出来：运营者第一件事就是确认该抄哪个 base_url
  if (dep.is_remote) {
    bits.push(`服务器模式（入口 ${dep.public_base_url || "?"}）`);
  } else {
    bits.push("本机模式");
  }
  // 改完 YAML 会不会自己生效，是运营者最该知道的一条状态：
  // 关着的时候他每改一次配置都得记得去点「重载配置」，而他不会记得。
  bits.push(health.config_watch
    ? `配置自动生效${health.config_watch.reload_count ? `（已自动 reload ${health.config_watch.reload_count} 次）` : ""}`
    : "配置需手动重载");
  $("#server-line").textContent = bits.join(" · ");
  // 小圆点也在这里一并给：它以前在 /admin/* 之后才赋值，
  // 未登录时会一直停在红点——而那并不表示网关挂了。
  const dot = $("#server-dot");
  if (dot) dot.className = "dot " + (health.status === "healthy" ? "on" : "off");
}

function byCount(map, k) { return (map && map[k]) ?? 0; }
function fmtK(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : num(n); }
function fmtTokens(n) { n = Number(n) || 0;
  return n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : num(n); }
const CNY_RATE = 7.2;   // USD→CNY 展示换算，牌价以 USD 存储，这里只是给人看的近似
function fmtCost(v) {
  v = Number(v) || 0;
  if (v <= 0) return "$0";
  // 大额给两位小数，极小额保留有效位，避免一片 $0.0000
  const usd = v >= 0.01 ? "$" + v.toFixed(2) : "$" + v.toPrecision(2);
  return `${usd} ≈¥${(v * CNY_RATE >= 0.01 ? (v * CNY_RATE).toFixed(2) : (v * CNY_RATE).toPrecision(2))}`;
}

/* ---- 中文翻译层：错误类型 + 上游错误原文 → 中文 ----
 * error_type 机器码保持不变（日志/API 稳定），只翻译给人看的展示层。 */
const ERR_TYPE_ZH = {
  rate_limit_error: "限流（429）",
  no_available_credential: "暂无可用 Key",
  no_available_deployment: "无可用部署",
  timeout: "超时",
  connection_error: "连接失败",
  upstream_error: "上游错误",
  unknown_error: "未知错误",
  invalid_request_error: "请求参数错误",
  unsupported_parameter: "不支持的参数",
  authentication_error: "Key 认证失败（401）",
  permission_denied: "无权限（403）",
  model_not_found: "模型不存在",
  context_length_exceeded: "上下文超长",
  content_filter: "内容被安全策略拦截",
  overloaded: "上游过载（529）",
  conflict_error: "请求冲突",
  client_disconnected: "客户端断开",
  no_stream_meta: "流式元数据缺失",
  provider_unavailable: "供应商不可用",
  config_error: "配置错误",
  invalid_alias: "别名无效",
  internal_error: "网关内部错误",
  zkai_error: "网关错误",
};
function zhType(type) {
  if (!type) return "-";
  return ERR_TYPE_ZH[type] ? `${ERR_TYPE_ZH[type]}` : type;
}
/** 把上游/网关的英文错误详情翻译成中文（保留原文在 tooltip）。 */
const ERR_DETAIL_PATTERNS = [
  [/inference exceeds tpm\/?rpm limit/i, "超出该账号每分钟限流（tpm/rpm），稍候自动恢复"],
  [/token plan entitlement exhausted/i, "套餐额度已耗尽（5 小时/周窗口重置）"],
  [/upstream returned HTTP 429/i, "上游返回 429 限流"],
  [/no usable credential for provider ['"]?([\w-]+)['"]?/i, "供应商 $1 当前没有可用的 Key"],
  [/pool recovers in ~(\d+)s/i, "约 $1 秒后可重试"],
  [/timed out after ([\d.]+)s/i, "超过 $1 秒无响应（超时）"],
  [/timeout while opening stream/i, "建立流式连接超时"],
  [/stream connection failed/i, "流式连接失败"],
  [/connection failed/i, "连接失败"],
  [/stream dropped/i, "流式连接中断"],
  [/environment variable (\S+) is not set/i, "环境变量 $1 未设置"],
  [/validationerror/i, "网关解析上游返回格式失败"],
  [/all (\d+) attempt\(s\) failed for model ['"]([^'"]+)['"]:?\s*(.*)/i, "模型 $2 的 $1 次尝试全部失败：$3"],
  [/disabled by operator/i, "已被手动禁用"],
  [/disabled in config/i, "配置中禁用"],
  [/invalid credential \(401\)/i, "Key 无效（401 认证失败）"],
  [/permission denied \(403\)/i, "无权限（403）"],
  [/returned a non-JSON body/i, "上游返回了非 JSON 内容"],
];
function zhDetail(detail) {
  if (!detail) return "-";
  let out = String(detail);
  for (const [re, zh] of ERR_DETAIL_PATTERNS) {
    if (re.test(out)) { out = out.replace(re, zh); break; }
  }
  return out;
}
/** 组合展示：类型中文 + 详情中文；英文原文留给 title 悬停查看。 */
function zhErr(type, detail) {
  const t = zhType(type);
  if (!detail) return t;
  const d = zhDetail(detail);
  return d === t ? t : (t === "-" ? d : `${t}：${d}`);
}
function bindRowClicks(root) {
  root.querySelectorAll("tr.row-click").forEach(tr =>
    tr.onclick = () => openDrawer(tr.dataset.rid));
}

/* ================= 凭据池 ================= */
async function loadPool() {
  const resp = await api("/admin/credentials");
  state.poolAt = Date.now() / 1000;
  const aff = resp.affinity || {};
  // 每把 Key 被多少通会话钉住
  const pinned = {};
  Object.values(aff.bindings || {}).forEach(list =>
    list.forEach(b => pinned[b.credential_id] = (pinned[b.credential_id] || 0) + 1));
  const rows = resp.data.map(c => {
    const until = (c.status === "cooldown" && c.cooldown_until)
      ? ` data-cd-until="${c.cooldown_until}"` : "";
    const cd = c.status === "cooldown" ? `<span${until}></span>` : "-";
    const pin = pinned[c.id] ? ` <span class="pill blue" title="钉住的会话数">📌${pinned[c.id]}</span>` : "";
    const quota = (c.rate_limits || []).map(q => {
      const win = q.window_seconds >= 86400 ? `${q.window_seconds / 86400}天`
        : q.window_seconds >= 3600 ? `${q.window_seconds / 3600}h`
        : q.window_seconds >= 60 ? `${q.window_seconds / 60}m` : `${q.window_seconds}s`;
      const dims = [];
      let ratio = 0;
      if (q.max_requests != null) {
        dims.push(`${q.used_requests}/${q.max_requests}次`);
        ratio = Math.max(ratio, q.max_requests ? q.used_requests / q.max_requests : 0);
      }
      if (q.max_tokens != null) {
        dims.push(`${fmtTokens(q.used_tokens)}/${fmtTokens(q.max_tokens)}tok`);
        ratio = Math.max(ratio, q.max_tokens ? q.used_tokens / q.max_tokens : 0);
      }
      const cls = ratio >= 1 ? "red" : ratio >= 0.8 ? "amber" : "green";
      const scopeZh = { credential: "Key", account: "账号", provider: "供应商" }[q.scope] || q.scope;
      return `<span class="pill ${cls}" title="主动配额（${scopeZh} ${esc(q.bucket)}）：${dims.join(" · ")}">${win} ${dims.join(" · ")}</span>`;
    }).join(" ");
    const actions = [];
    if (c.status !== "disabled") actions.push(`<button class="mini" data-act="disable" data-id="${esc(c.id)}">禁用</button>`);
    else actions.push(`<button class="mini" data-act="enable" data-id="${esc(c.id)}">启用</button>`);
    if (c.status === "cooldown" || c.status === "unhealthy")
      actions.push(`<button class="mini" data-act="enable" data-id="${esc(c.id)}">解除冷却</button>`);
    return `<tr><td class="acts"><span class="cell-id"><b>${esc(c.id)}</b>${pin}</span></td>
      <td class="cell-sub">${c.tags.map(esc).join(" ")}</td>
      <td>${esc(c.provider_id)}</td>
      <td>${pill(c.status)}</td>
      <td>${c.priority}</td>
      <td>${quota || '<span class="muted">-</span>'}</td>
      <td>${c.success_count}</td>
      <td>${c.failure_count}</td>
      <td>${c.rate_limit_count}</td>
      <td>${cd}</td>
      <td class="muted ell" title="${esc(c.last_error_detail || "")}${esc(c.disabled_reason || "")}">
        ${esc(c.last_error_type ? zhErr(c.last_error_type, c.last_error_detail) : (c.disabled_reason ? zhDetail(c.disabled_reason) : "-"))}</td>
      <td class="muted small" title="${esc(c.secret_ref || "")}">${esc(c.secret_masked || c.secret_source)}</td>
      <td class="acts-end">${actions.length ? `<div class="row-flex">${actions.join("")}</div>` : ""}</td>
    </tr>`;
  }).join("");
  const s = resp.stats;
  const totalPins = Object.values(pinned).reduce((a, b) => a + b, 0);
  $("#view-pool").innerHTML = `
    <div class="view-head">
      <h2>凭据池</h2>
      <span class="desc">每把 Key 的状态、优先级、配额用量与冷却倒计时；可逐把启用 / 禁用 / 解除冷却</span>
    </div>
    <div class="toolbar">
      <span class="small muted">轮转策略：${esc(s.rotation)}</span>
      <span class="pill ${aff.enabled ? "green" : "gray"}">会话亲和 ${aff.enabled ? "开" : "关"}${aff.enabled ? ` · ${totalPins} 通会话 · TTL ${dur(aff.ttl_seconds || 0)}` : ""}</span>
      <span class="pill blue">可用 ${s.usable}/${s.total}</span>
      <span class="pill green">成功 ${s.success}</span>
      <span class="pill red">失败 ${s.failure}</span>
      <span class="pill amber">限流 ${s.rate_limits}</span>
      <span class="grow"></span>
      <button id="pool-add-key">➕ 加 Key</button>
      <button id="pool-providers">🏢 供应商</button>
      <button id="pool-limits">⚙ 限额</button>
      <button id="pool-clear-all">🧹 全部清冷却</button>
    </div>
    <div class="tablewrap"><table>

/* ================= 限额编辑器（供应商主动配额） ================= */
const LIMIT_WINDOWS = [
  [60, "1 分钟"], [300, "5 分钟"], [3600, "1 小时"],
  [18000, "5 小时"], [86400, "1 天"], [604800, "7 天"],
];
const LIMIT_SCOPES = [
  ["credential", "每把 Key"], ["account", "按账号（account-* 标签共享）"], ["provider", "全供应商共享"],
];
function renderLimitsModal() {
  const modal = $("#limits-modal");
  const collect = (card) => Array.from(card.querySelectorAll("[data-rule]")).map(row => {
    const f = name => row.querySelector(`[data-f="${name}"]`);
    const winSel = f("window");
    const win = winSel.value === "custom" ? Number(f("window_custom").value) : Number(winSel.value);
    return {
      scope: f("scope").value,
      window_seconds: win,
      max_requests: Number(f("max_requests").value) || 0,
      max_tokens: Number(f("max_tokens").value) || 0,
    };
  });
  const cards = (state.limitsProviders || []).map(p => {
    const rules = state.limitsEdit[p.id] || [];
    const rows = rules.map((r, i) => {
      const known = LIMIT_WINDOWS.some(w => w[0] === Number(r.window_seconds));
      const winSel = LIMIT_WINDOWS.map(([sec, label]) =>
        `<option value="${sec}" ${Number(r.window_seconds) === sec ? "selected" : ""}>${label}</option>`).join("");
      const scopeSel = LIMIT_SCOPES.map(([v, label]) =>
        `<option value="${v}" ${(r.scope || "credential") === v ? "selected" : ""}>${label}</option>`).join("");
      return `<div class="dep-card" data-rule="${i}">
        <div class="row-flex">
          <label class="small muted" style="display:flex;gap:4px;align-items:center">作用域<select data-f="scope">${scopeSel}</select></label>
          <label class="small muted" style="display:flex;gap:4px;align-items:center">窗口<select data-f="window">${winSel}<option value="custom" ${known ? "" : "selected"}>自定义…</option></select></label>
          <input type="number" data-f="window_custom" style="width:92px;display:${known ? "none" : "inline-block"}" value="${esc(r.window_seconds)}" placeholder="秒">
          <label class="small muted" style="display:flex;gap:4px;align-items:center">次数上限<input type="number" data-f="max_requests" style="width:110px" value="${r.max_requests ?? 0}" min="0"></label>
          <label class="small muted" style="display:flex;gap:4px;align-items:center">Token 上限<input type="number" data-f="max_tokens" style="width:130px" value="${r.max_tokens ?? 0}" min="0"></label>
          <span class="grow"></span>
          <button class="mini" data-rule-del="${i}">✕ 删除</button>
        </div>
        <div class="small muted">0 = 该项不限；两项可同设，按更紧的一项拦。Token 按请求完成后的真实用量计。</div>
      </div>`;
    }).join("");
    const src = p.rate_limits_source === "console"
      ? '<span class="pill blue" title="控制台改动优先于 YAML">控制台</span>'
      : '<span class="pill gray">YAML</span>';
    return `<div class="dep-card" data-pid="${esc(p.id)}">
      <div class="row-flex">
        <b>${esc(p.id)}</b>${src}<span class="grow"></span>
        <button class="mini" data-rule-add="${esc(p.id)}">➕ 加规则</button>
        ${p.rate_limits_source === "console" ? `<button class="mini" data-limit-reset="${esc(p.id)}">↺ 恢复 YAML</button>` : ""}
        <button class="primary mini" data-limit-save="${esc(p.id)}">💾 保存生效</button>
      </div>
      ${rows || '<div class="small muted" style="margin-top:6px">未设限额（不限流）</div>'}
    </div>`;
  }).join("");
  modal.innerHTML = `<div class="card wide">
    <h3>主动配额限额</h3>
    <div class="modal-sub">到线的 Key 会被直接跳过，不再发出注定 429 的请求。改动保存后立即生效并写入数据库（优先于 YAML，重启不丢）；想改回 YAML 里的值，点「↺ 恢复 YAML」。</div>
    ${cards}
    <div class="modal-actions"><span class="grow"></span><button id="lm-close">关闭</button></div>
  </div>`;
  openModal("#limits-modal");
  $("#lm-close").onclick = () => closeModal("#limits-modal");
  modal.querySelectorAll("[data-rule-del]").forEach(b => b.onclick = () => {
    const card = b.closest("[data-pid]");
    const pid = card.dataset.pid;
    state.limitsEdit[pid] = collect(card);
    state.limitsEdit[pid].splice(Number(b.dataset.ruleDel), 1);
    renderLimitsModal();
  });
  modal.querySelectorAll("[data-rule-add]").forEach(b => b.onclick = () => {
    const card = b.closest("[data-pid]");
    const pid = b.dataset.ruleAdd;
    state.limitsEdit[pid] = collect(card);
    (state.limitsEdit[pid] = state.limitsEdit[pid] || []).push(
      { scope: "credential", window_seconds: 60, max_requests: 40, max_tokens: 0 });
    renderLimitsModal();
  });
  modal.querySelectorAll("[data-f='window']").forEach(sel => sel.onchange = () => {
    const custom = sel.value === "custom";
    const input = sel.closest(".dep-card").querySelector("[data-f='window_custom']");
    input.style.display = custom ? "inline-block" : "none";
    if (custom) input.focus();
  });
  modal.querySelectorAll("[data-limit-save]").forEach(btn => btn.onclick = async () => {
    const pid = btn.dataset.limitSave;
    const card = btn.closest("[data-pid]");
    const rules = collect(card).map(r => {
      const out = { scope: r.scope, window_seconds: r.window_seconds };
      if (r.max_requests > 0) out.max_requests = r.max_requests;
      if (r.max_tokens > 0) out.max_tokens = r.max_tokens;
      return out;
    });
    const bad = rules.find(r => !r.max_requests && !r.max_tokens);
    if (bad) { toast("每条规则至少要设一个上限（次数或 Token）", "err"); return; }
    const r = await api(`/admin/providers/${encodeURIComponent(pid)}/limits`,
      { method: "PUT", json: { rules } });
    if (r.error) { toast(r.error.message || "保存失败", "err"); return; }
    toast(`${pid} 限额已生效${syncedNote(r)}`, "ok");
    openLimitsModal();
  });
  modal.querySelectorAll("[data-limit-reset]").forEach(btn => btn.onclick = async () => {
    const pid = btn.dataset.limitReset;
    if (!confirm(`恢复 ${pid} 的限额为 providers.yaml 中的值？（控制台改动将被丢弃）`)) return;
    const r = await api(`/admin/providers/${encodeURIComponent(pid)}/limits`, { method: "DELETE" });
    if (r.error) { toast(r.error.message || "恢复失败", "err"); return; }
    toast(`${pid} 已恢复 YAML 限额${syncedNote(r)}`, "ok");
    openLimitsModal();
  });
}

async function openAddKeyModal(presetPid) {
  const resp = await api("/admin/providers");
  const providers = (resp.data || []).filter(p => p.requires_credential);
  if (!providers.length) { toast("没有可加 Key 的供应商（都要凭据）", "err"); return; }
  const modal = $("#addkey-modal");
  modal.innerHTML = `<div class="card wide">
    <h3>➕ 给供应商加 Key</h3>
    <div class="modal-sub">Key 会写进 <code>.env</code>（已被 gitignore），<code>providers.yaml</code> 里只记「变量名」——
    换机器、重建环境时不用重新配。选好供应商后，ID 和变量名会自动帮你起好。</div>
    <div class="formgrid">
      <label>供应商
        <select id="ak-provider">${providers.map(p => `<option value="${esc(p.id)}" ${p.id === presetPid ? "selected" : ""}>${esc(p.id)}</option>`).join("")}</select>
      </label>
      <label>Key 的 ID（唯一短名，不是 Key 本身）
        <input type="text" id="ak-id" placeholder="如 sensenova-10"></label>
      <label>环境变量名（.env 里的那个）
        <input type="text" id="ak-env" placeholder="如 SENSENOVA_API_KEY_10"></label>
      <label>Key 值（写进 .env，不会存到 YAML）
        <input type="password" id="ak-value" placeholder="粘贴 Key，如 sk-…" autocomplete="off"></label>
      <label>优先级（越小越优先，默认 100）
        <input type="number" id="ak-priority" value="100"></label>
    </div>
    <div class="modal-actions">
      <button class="primary" id="ak-save">💾 保存</button>
      <button id="ak-cancel">取消</button>
    </div>
  </div>`;
  openModal("#addkey-modal");
  // 自动命名：切供应商时按已有条目递增，省掉两次「起名字」的思考
  const suggestNames = () => {
    const p = providers.find(x => x.id === $("#ak-provider").value);
    if (!p) return;
    const n = (p.credentials || []).length + 1;
    const pad = String(n).padStart(2, "0");
    $("#ak-id").value = `${p.id.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${pad}`;
    $("#ak-env").value = `${p.id.toUpperCase().replace(/[^A-Z0-9]+/g, "_")}_API_KEY${n > 1 ? "_" + pad : ""}`;
  };
  $("#ak-provider").onchange = suggestNames;
  suggestNames();
  $("#ak-cancel").onclick = () => closeModal("#addkey-modal");
  $("#ak-save").onclick = async () => {
    const payload = {
      id: $("#ak-id").value.trim(),
      env_var: $("#ak-env").value.trim() || null,
      priority: Number($("#ak-priority").value || 100),
    };
    const value = $("#ak-value").value.trim();
    if (!payload.id) { toast("Key 的 ID 不能为空", "err"); return; }
    if (!payload.env_var) { toast("环境变量名不能为空（Key 值写 .env，这里只记名字）", "err"); return; }
    if (value) { payload.value = value; payload.write_env = true; }
    try {
      const pid = $("#ak-provider").value;
      const r = await api(`/admin/providers/${encodeURIComponent(pid)}/credentials`,
        { method: "POST", json: payload });
      if (r.error) { toast(r.error.message || "保存失败", "err"); return; }
      toast(`已加 ${payload.id} 到 ${pid}${syncedNote(r)}${r.env_synced ? "，Key 已写入 " + r.env_synced : ""}`, "ok");
      closeModal("#addkey-modal");
      loadPool();
    } catch (err) { toast(err.message, "err"); }
  };
}

      <span class="muted small">第 ${page}/${pages} 页 · 共 ${num(resp.total)} 条</span>
      <button id="r-next" ${state.req.offset + state.req.size >= resp.total ? "disabled" : ""}>下一页 →</button>
      <span class="grow"></span>
      <span class="small muted">↪ 表示发生了故障转移</span>
    </div>`;
  $("#r-go").onclick = () => { state.req.offset = 0; loadRequests(true); };

    ["#f-status","#f-provider","#f-alias","#f-model","#f-error","#f-q"].forEach(id => $(id).value = "");

  };
  $("#r-prev").onclick = () => { state.req.offset = Math.max(0, state.req.offset - state.req.size); loadRequests(true); };
  $("#r-next").onclick = () => { state.req.offset += state.req.size; loadRequests(true); };
  bindRowClicks($("#view-requests"));
}
function collectFilters() {
  const g = id => ($(id) ? ($(id).value || "").trim() : "");

           model: g("#f-model"), error: g("#f-error"), q: g("#f-q") };

function restoreFilters(prev) {

  s("#f-model", prev.model); s("#f-error", prev.error); s("#f-q", prev.q);
}

async function openDrawer(requestId) {
  if (!requestId) return;
  try {

    const r = d.request || {};
    const attempts = (d.attempts || []).map(a => `<tr>
      <td>${rankBadge(a.attempt_number)}</td>
      <td>${esc(a.provider)}<div class="small muted">${esc(a.model || "")}</div></td>

      <td>${pill(a.status)}</td>

      <td class="muted" title="${esc(a.error_type || "")}">${esc(a.error_type ? zhType(a.error_type) : "")}</td>
      <td class="ell small" style="max-width:220px" title="${esc(a.detail || "")}">${esc(a.detail ? zhDetail(a.detail) : "")}</td>
      <td>${a.latency_ms ? Math.round(a.latency_ms) + "ms" : "-"}</td>
      <td>${fmtK((a.input_tokens || 0) + (a.output_tokens || 0))}</td>

        <dt>落点</dt><dd>${esc(r.provider || "-")} / ${esc(r.deployment_id || "-")} / ${esc(r.credential_id || "-")}</dd>
        <dt>状态</dt><dd>${pill(r.status)} ${r.http_status ?? ""} ${r.error_type ? "· " + esc(zhType(r.error_type)) : ""}</dd>
        <dt>流式 / 尝试</dt><dd>${r.stream ? "流式" : "普通"} · ${r.attempt_count ?? 0} 次${r.fallback_used ? " · 有故障转移" : ""}</dd>
        <dt>延迟 / Tokens</dt><dd>${r.latency_ms ? Math.round(r.latency_ms) + "ms" : "-"} ·
          入 ${num(r.input_tokens)} / 出 ${num(r.output_tokens)} / 共 ${num(r.total_tokens)}</dd>
        <dt>等价成本</dt><dd>${fmtCost(r.cost_usd)}<span class="muted small"> · 按牌价折算，免费渠道即省下的费用</span></dd>
        <dt>客户端</dt><dd class="small">${esc(r.client_ip || "-")} · ${esc((r.user_agent || "").slice(0, 70))}</dd>
        <dt>时间</dt><dd>${fmtTime(r.started_at)} → ${fmtTime(r.finished_at)}</dd>
      </dl>
      ${r.routing_reason ? `<details class="raw"><summary>路由决策</summary><pre>${esc(r.routing_reason)}</pre></details>` : ""}
      <h4 class="sec">尝试明细（共 ${(d.attempts || []).length} 次）</h4>
      <div class="tablewrap"><table>
        <thead><tr><th>#</th><th>供应商</th><th>凭据</th><th>结果</th><th>HTTP</th><th>错误</th><th>详情</th><th>延迟</th><th>Tokens</th></tr></thead>
        <tbody>${attempts || '<tr><td colspan="9" class="muted">无尝试记录（可能是修复前的流式请求）</td></tr>'}</tbody>

async function loadUsage() {
  const stats = await api(`/admin/stats?days=${state.usageDays}&recent=0`);
  const u = stats.usage || {};
  const kpi = (label, value, sub, tone) => `<div class="kpi${tone ? " is-" + tone : ""}">
    <div class="k-label">${esc(label)}</div>
    <div class="k-value">${value}</div>
    <div class="k-sub">${esc(sub || "")}</div></div>`;
  const maxDay = Math.max(1, ...(stats.daily || []).map(x => x.tokens));
  const daily = (stats.daily || []).map(x => `<tr>
      <td>${esc(x.day)}</td><td>${num(x.requests)}</td>
      <td><div class="row-flex"><div class="bar" style="width:${Math.max(4, x.tokens / maxDay * 100)}px"><i></i></div>
      <span class="muted small">${fmtK(x.tokens)}</span></div></td></tr>`).join("");
  const rows = (arr, first) => arr.map(x => `<tr><td>${esc(x[first]) || "—"}</td>
      <td>${num(x.requests)}</td><td>${fmtK(x.tokens)}</td>
      <td>${fmtCost(x.cost_usd)}</td></tr>`).join("");
  // 按别名：io 比是全站判断「这条链是否在过度重读历史」的抓手。
  // 全站基线约 132:1（2026-09-26 实测）；某条链显著高于它，通常是路由把它死钉在
  // 一个慢模型上（zk-k3 实测 640:1，吃掉全站 input 的 72%）。
  // >200:1 标黄、>500:1 标红：颜色只是提示，阈值写在文案里，不靠猜。
  const aliasRows = arr => arr.map(x => {
    const r = x.io_ratio || 0;
    const tone = r > 500 ? "is-bad" : r > 200 ? "is-warn" : "";
    const note = r > 500 ? "（严重：每轮几乎都在重读历史）"
      : r > 200 ? "（偏高：看看是不是死钉了单个模型）" : "";
    return `<tr class="${tone}"><td>${esc(x.alias)}${note ? `<span class="muted small">${note}</span>` : ""}</td>
      <td>${num(x.requests)}</td><td>${fmtK(x.input_tokens)}</td>
      <td>${fmtK(x.output_tokens)}</td><td>${r ? num(r) + ":1" : "—"}</td>
      <td>${fmtCost(x.cost_usd)}</td></tr>`;
  }).join("");
  $("#view-usage").innerHTML = `
    <div class="view-head">
      <h2>用量统计</h2>
      <span class="desc">Token 与等价成本（按公开牌价折算，免费渠道即省下的钱）</span>
    </div>
    <div class="toolbar">
      <span class="muted small">时间窗口</span>
      <select id="u-days">${[1, 7, 30].map(d => `<option value="${d}" ${d === state.usageDays ? "selected" : ""}>近 ${d} 天</option>`).join("")}</select>
      <span class="grow"></span>
      <button id="u-backfill" title="把历史零成本记录按当前牌价补算">🧮 回填历史成本</button>
    </div>
    <div class="grid kpis">
      ${kpi("请求数", num(u.requests), `窗口 ${stats.window_days} 天`)}
      ${kpi("输入 Tokens", fmtK(u.input_tokens), num(u.input_tokens) + " 精确值")}
      ${kpi("输出 Tokens", fmtK(u.output_tokens), num(u.output_tokens) + " 精确值")}
      ${kpi("等价成本", fmtCost(u.cost_usd), "按公开牌价折算；免费渠道=省下的钱，付费渠道=真实成本")}
    </div>
    <h4 class="sec">按天</h4>
    <div class="tablewrap"><table><thead><tr><th>日期</th><th>请求数</th><th>Tokens</th></tr></thead>
      <tbody>${daily || '<tr><td colspan="3" class="muted">暂无数据</td></tr>'}</tbody></table></div>
    <h4 class="sec">按别名（客户端选了哪条链）</h4>
    <div class="tablewrap"><table><thead><tr>
      <th>别名</th><th>请求数</th><th>输入 Tokens</th><th>输出 Tokens</th>
      <th>输入/输出</th><th>成本</th></tr></thead>
      <tbody>${aliasRows(u.by_alias || [])}</tbody></table></div>
    <h4 class="sec">按供应商</h4>
    <div class="tablewrap"><table><thead><tr><th>供应商</th><th>请求数</th><th>Tokens</th><th>成本</th></tr></thead>
      <tbody>${rows(u.by_provider || [], "provider")}</tbody></table></div>
    <h4 class="sec">按模型（Top）</h4>
    <div class="tablewrap"><table><thead><tr><th>模型</th><th>请求数</th><th>Tokens</th><th>成本</th></tr></thead>
      <tbody>${rows(u.top_models || [], "model")}</tbody></table></div>
    <h4 class="sec">按凭据（哪把 Key 在干活）</h4>
    <div class="tablewrap"><table><thead><tr><th>凭据</th><th>请求数</th><th>Tokens</th><th>成本</th></tr></thead>
      <tbody>${rows(u.by_credential || [], "credential_id")}</tbody></table></div>`;
  $("#u-days").onchange = e => { state.usageDays = Number(e.target.value); loadUsage(); };
  $("#u-backfill").onclick = async () => {
    const r = await api("/admin/usage/backfill-cost", { method: "POST" });
    toast(r.updated ? `已回填 ${r.updated} 条，合计 $${r.total_cost_usd}` : "没有需要回填的记录", "ok");
    loadUsage();
  };
}
