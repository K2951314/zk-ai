<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZK-AI 控制台</title>
<link rel="stylesheet" href="/ui/console.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">⚡</span>
      <span>
        <div class="name">ZK-AI</div>
        <div class="sub">本地 AI 网关控制台</div>
      </span>
    </div>
    <nav class="nav" id="tabs">
      <div class="nav-label">监控</div>
      <button class="nav-item active" data-view="overview"><span class="ico">📊</span>总览</button>
      <button class="nav-item" data-view="pool"><span class="ico">🔑</span>凭据池</button>
      <button class="nav-item" data-view="requests"><span class="ico">📨</span>请求记录</button>
      <button class="nav-item" data-view="usage"><span class="ico">📈</span>用量统计</button>
      <button class="nav-item" data-view="report"><span class="ico">🩺</span>体检</button>
      <div class="nav-label">配置</div>
      <button class="nav-item" data-view="models"><span class="ico">🧩</span>模型与别名</button>
      <button class="nav-item" data-view="burner"><span class="ico">🔥</span>积分消耗器</button>
    </nav>
    <div class="sidebar-foot">
      <div>版本 <span class="ver" id="side-version">-</span></div>
      <div id="side-uptime">-</div>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <span class="conn">
        <span class="dot off" id="server-dot"></span>
        <span class="txt" id="server-line">未连接</span>
      </span>
      <span class="grow"></span>
      <div id="quarantine-banner" class="row-flex small" style="display:none;gap:6px;align-items:center;flex-wrap:wrap"></div>
      <span class="grow"></span>
      <label class="field-label">自动刷新
        <select id="auto-interval">
          <option value="0">关</option><option value="5">5 秒</option>
          <option value="10" selected>10 秒</option><option value="30">30 秒</option>
        </select>
      </label>
      <button id="btn-theme" class="ghost" title="切换浅色 / 暗色">🌙</button>
      <button id="btn-refresh">⟳ 刷新</button>
      <button id="btn-token">🔑 令牌</button>
      <button id="btn-chatgpt" title="客户端接入：base_url、令牌、各客户端配置片段">🌏 客户端接入</button>
    </header>

    <main>
      <section class="view active" id="view-overview"></section>
      <section class="view" id="view-pool"></section>
      <section class="view" id="view-requests"></section>
      <section class="view" id="view-usage"></section>
      <section class="view" id="view-models"></section>
      <section class="view" id="view-burner"></section>
      <section class="view" id="view-report"></section>
    </main>
  </div>
</div>

<nav id="mnav" aria-label="主要视图"></nav>
<aside id="drawer"></aside>
<div id="toasts"></div>
<div class="modal-mask" id="model-modal"></div>
<div class="modal-mask" id="alias-modal"></div>
<div class="modal-mask" id="limits-modal"></div>
<div class="modal-mask" id="market-modal"></div>
<div class="modal-mask" id="addkey-modal"></div>
<div class="modal-mask" id="providers-modal"></div>
<div class="modal-mask" id="chatgpt-modal"></div>
<div id="auth"><div class="card">
  <h3>🔑 需要管理令牌</h3>
  <div class="small muted" style="line-height:1.7">把项目 <code>.env</code> 里 <code>ZKAI_ADMIN_TOKEN=</code> 后面那串原样粘进来。
  改过 <code>.env</code> 后令牌会变，浏览器里存的旧值需要重新粘一次。令牌只保存在本机浏览器的 localStorage。</div>
  <input type="text" id="auth-token" placeholder="粘贴管理令牌 …">
  <div class="row-flex"><button class="primary" id="auth-save">保存并连接</button>
  <button id="auth-cancel">取消</button></div>
</div></div>

<script src="/ui/console.js"></script>
</body>
</html>
