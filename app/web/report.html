<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZK-AI 体检 · 一眼看穿网关在干什么</title>
<style>
:root{
  --bg:#faf9f6;--panel:#fff;--panel-2:#f3f3ef;--border:#dfe4e1;--strong:#d1d9d5;
  --text:#202a30;--text-2:#303c42;--muted:#59656b;
  --accent:#176b75;--accent-soft:rgba(23,107,117,.08);
  --ok:#2f7d5c;--ok-soft:rgba(47,125,92,.09);--ok-border:rgba(47,125,92,.25);
  --warn:#b8873a;--warn-soft:rgba(184,135,58,.09);--warn-border:rgba(184,135,58,.28);
  --err:#b3402a;--err-soft:rgba(179,64,42,.08);--err-border:rgba(179,64,42,.25);
}

:root[data-theme="dark"]{
  --bg:#13191c;--panel:#1a2226;--panel-2:#202a2f;--border:rgba(255,255,255,.08);--strong:rgba(255,255,255,.12);
  --text:#e7eceb;--text-2:#d2dada;--muted:#a5b0b3;
  --accent:#12ccd8;--accent-soft:rgba(18,204,216,.12);
  --ok:#5fc79a;--ok-soft:rgba(95,199,154,.12);--ok-border:rgba(95,199,154,.32);
  --warn:#d3b26a;--warn-soft:rgba(211,178,106,.12);--warn-border:rgba(211,178,106,.32);
  --err:#d86a52;--err-soft:rgba(216,106,82,.12);--err-border:rgba(216,106,82,.32);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  padding:24px 16px 64px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:15px;margin:0 0 12px;color:var(--text-2);font-weight:600}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.back{font-size:12.5px;color:var(--accent);text-decoration:none}
.back:hover{text-decoration:underline}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:650;margin-top:2px;letter-spacing:-.02em}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.is-warn .v{color:var(--warn)}.kpi.is-ok .v{color:var(--ok)}.kpi.is-err .v{color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel-2)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.is-slow td{background:var(--warn-soft)}
tr.is-err td{background:var(--err-soft)}
.bar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.note{font-size:12.5px;color:var(--text-2);background:var(--accent-soft);
  border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;margin-top:12px}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}
.note.ok{background:var(--ok-soft);border-color:var(--ok)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;
  border:1px solid var(--border);color:var(--text-2);background:var(--panel-2);margin-left:6px}
.tag.k{background:#f5f3ff;border-color:#ddd6fe;color:#5b21b6}
.tag.f{background:#ecfeff;border-color:#a5f3fc;color:#155e75}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
details{margin-top:8px}summary{cursor:pointer;font-size:12.5px;color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
label input,label select{font:inherit;padding:5px 8px;border:1px solid var(--strong);
  border-radius:7px;background:var(--panel);color:var(--text)}
button{font:inherit;padding:7px 14px;border:1px solid var(--strong);border-radius:8px;
  background:var(--panel);color:var(--text);cursor:pointer}
button:hover{background:var(--panel-2)}
pre{background:var(--panel-2);padding:12px;border-radius:8px;overflow:auto}
/* ---------- 实时区（打开就在眼前，不用点任何按钮） ---------- */
.live{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:16px 20px;margin-bottom:16px}
.live-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.live-head h2{margin:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.paused{background:var(--muted)}
.dot.busy{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.live-meta{font-size:11.5px;color:var(--muted);margin-left:auto}
.live-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.live-cell{border:1px solid var(--border);border-radius:9px;padding:10px 12px;
  background:var(--panel-2)}
.live-cell .l{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.live-cell .v{font-size:20px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.live-cell .s{font-size:11px;color:var(--muted);margin-top:2px}
.live-cell.warn .v{color:var(--warn)}
.live-cell.ok .v{color:var(--ok)}
.live-cell.err .v{color:var(--err)}
.rate{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;
  background:var(--panel);border:1px solid var(--border)}
.rate i{display:block;height:100%}
.rate .r-ok{background:var(--ok)}
.rate .r-err{background:var(--err)}
.rate .r-rl{background:var(--warn)}
.rate .r-idle{background:var(--strong)}
.alerts{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.alert{font-size:12.5px;padding:9px 12px;border-radius:0 8px 8px 0;border-left:3px solid}
.alert.warn{background:var(--warn-soft);border-color:var(--warn);color:#78350f}
.alert.err{background:var(--err-soft);border-color:var(--err);color:#7f1d1d}
.alert b{font-weight:650}
  .kpis-head { font-size: 12px; color: var(--muted); margin: 0 0 8px 2px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/ui">← 返回控制台</a>
  <h1 style="margin-top:10px">ZK-AI 体检</h1>
  <div class="sub">一眼看穿：请求慢在哪、派给了谁、为什么派给它。数据来自网关自己的库，全程只读。</div>

  <div class="live" id="live">
    <div class="live-head">
      <span class="dot" id="live-dot"></span>
      <h2>此刻在跑</h2>
      <span class="live-meta" id="live-meta">正在读…</span>
    </div>
    <div class="live-grid" id="live-grid">
      <div class="live-cell"><div class="l">读取中</div></div>
    </div>
    <div class="alerts" id="alerts"></div>
  </div>

  <div class="card" style="padding:12px 16px">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="hint" style="margin:0">历史分析范围</span>
      <label style="display:flex;align-items:center;gap:6px">
        <select id="days"><option>1</option><option selected>7</option><option>30</option></select>
        天
      </label>
          <button id="go">刷新</button>
      <button id="theme-btn" class="ghost" title="切换浅色 / 暗色">🌙</button>
      <span class="hint" style="margin:0">页面打开时已自动跑过一次；令牌沿用控制台里那份，不用再填</span>
    </div>
  </div>

  <div id="out"></div>
</div>

<script>
// 与控制台同源：从 /ui 打开时同域，直接用相对路径；令牌复用 localStorage 里那份。
const BASE = location.origin;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n ?? 0).toLocaleString();

/* 主题与控制台共用同一份偏好（localStorage 的 zkai_theme），两边永远一个颜色。 */
const applyTheme = t => {
  document.documentElement.dataset.theme = t;
  const b = document.getElementById("theme-btn");
  if (b) b.textContent = t === "dark" ? "☀️" : "🌙";
  try { localStorage.setItem("zkai_theme", t); } catch {}
};
$("theme-btn").onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
let savedTheme = "light";
try { savedTheme = localStorage.getItem("zkai_theme") || "light"; } catch {}
applyTheme(savedTheme);
const sec = ms => ms >= 60000 ? (ms/60000).toFixed(1)+' 分'
  : ms >= 1000 ? (ms/1000).toFixed(1)+' 秒' : Math.round(ms)+' 毫秒';

function token() {
  try { return localStorage.getItem('zkai_admin_token') || ''; } catch { return ''; }
}

async function api(path) {
  const tok = token();
  const r = await fetch(BASE + path, {
    headers: tok ? {'X-Admin-Token': tok, 'Authorization': 'Bearer ' + tok} : {}
  });
  if (!r.ok) {
    let m = `HTTP ${r.status}`;
    try { m = (await r.json()).error?.message || m; } catch {}
    throw new Error(m);
  }
  return r.json();
}

// 模型 -> 人话标签：帮非程序员认出谁是谁、谁快谁慢
function label(model) {
  if (/kimi-k3/i.test(model)) return 'Kimi K3<span class="tag k">旗舰·慢但强</span>';
  if (/glm-5\.3-flash/i.test(model)) return 'GLM-5.3 Flash<span class="tag f">快·便宜</span>';
  if (/glm-5\.3/i.test(model)) return 'GLM-5.3<span class="tag f">快·便宜</span>';
  if (/step-5/i.test(model)) return 'Step 5<span class="tag f">快·便宜</span>';
  if (/deepseek/i.test(model)) return 'DeepSeek V4<span class="tag f">快·便宜</span>';
  if (/flash-lite|qwen|nemotron/i.test(model)) return '轻量模型<span class="tag f">快·便宜</span>';
  return esc(model);
}

/* ================= 历史区：打开即自动加载，不用点任何按钮 ================= */
async function loadHistory() {
  const days = $("days").value;
  const out = $("out");
  out.innerHTML = '<div class="card">正在读网关数据…</div>';
  try {
    // 不按成功状态过滤：失败的请求才是体检要看的东西。
    // 旧版只拿成功的那一部分，会把 429 / 超时整批藏起来，
    // 这里看到的就只能是一片假绿。
    const [stats, reqs] = await Promise.all([
      api(`/admin/stats?days=${days}&recent=0`),
      api(`/admin/requests?limit=500`),
    ]);
    render(stats, reqs, days);
  } catch (e) {
    out.innerHTML = `<div class="card"><div class="note warn">
      <b>读不到数据：</b>${esc(e.message)}<br><br>
      最常见的原因：控制台还没登录（回 <a class="back" href="/ui">/ui</a> 点右上角「🔑 令牌」填一次），
      或者网关没起来（双击 <span class="mono">scripts\\start_gateway.cmd</span>）。</div></div>`;
  }
}

/* ================= 实时区：网关进程内存里的「此刻」 =================
   /health 是唯一不查库、直接反映现在的接口：凭据池成功/失败/限流计数、
   谁在冷却、谁被自动隔离、配置有没有缺口。这些就是正在发生的事。 */
async function loadLive() {
  try {
    renderLive(await api("/health"));
  } catch (e) {
    $("live-grid").innerHTML =
      `<div class="live-cell err"><div class="l">实时状态</div>
       <div class="v" style="font-size:13px">读不到 /health</div>
       <div class="s">${esc(e.message)}</div></div>`;
  }
}

function dur(s) {
  s = Math.max(0, Math.round(s || 0));
  if (s >= 3600) return (s / 3600).toFixed(1) + " 小时";
  if (s >= 60) return Math.round(s / 60) + " 分";
  return s + " 秒";
}

function ago(s) {
  s = Math.max(0, Math.round(s || 0));
  if (s >= 86400) return Math.round(s / 86400) + " 天前";
  if (s >= 3600) return Math.round(s / 3600) + " 小时前";
  if (s >= 60) return Math.round(s / 60) + " 分钟前";
  return s + " 秒前";
}

function renderLive(h) {
  const c = h.credentials || {};
  const q = h.quarantined_deployments || {};
  const qids = Object.keys(q);
  const cfg = h.config || {};
  const gaps = cfg.credential_env_gaps || {};
  const gapIds = Object.keys(gaps);
  const stale = cfg.stale_files || [];
  const warns = cfg.warnings || [];
  const cw = h.config_watch || {};
  const byStatus = c.by_status || {};
  const total = c.requests || 0;
  const succ = c.success || 0;
  const fail = c.failure || 0;
  const rl = c.rate_limits || 0;
  const idle = Math.max(0, total - succ - fail - rl);
  const rate = succ / Math.max(1, total);
  const providers = h.providers || {};

  const busy = total > 0;
  const dot = $("live-dot");
  dot.className = "dot" + (busy ? " busy" : " paused");
  $("live-meta").textContent =
    `已运行 ${dur(h.uptime_seconds)} · 本进程累计 ${total} 次调用 · 更新于 ` +
    new Date().toLocaleTimeString("zh-CN", { hour12: false });

  const cell = (cls, l, v, s) =>
    `<div class="live-cell ${cls}"><div class="l">${l}</div>
     <div class="v">${v}</div><div class="s">${s}</div></div>`;
  const pct = x => (x / Math.max(1, total) * 100).toFixed(1) + "%";

  $("live-grid").innerHTML = [
    cell("", "本进程成功率", (rate * 100).toFixed(0) + "%",
      `${succ} 成 / ${fail} 败 / ${rl} 限流`),
    cell("", "凭据池", `${byStatus.healthy || 0} 把在线`,
      `${c.total || 0} 把共 ${byStatus.cooldown || 0} 冷却`),
    cell("", "供应商", `${providers.available || 0}/${providers.total || 0} 可用`,
      `${h.models || 0} 个模型 · ${(h.aliases || []).length} 个别名`),
    cell("", "自动隔离", qids.length ? `${qids.length} 个部署` : "无",
      qids.length ? "连续失败被临时屏蔽" : "所有部署可路由"),
    `<div class="live-cell"><div class="l">本进程调用构成</div>
     <div class="rate">
      <i class="r-ok" style="width:${pct(succ)}" title="成功 ${pct(succ)}"></i>
      <i class="r-rl" style="width:${pct(rl)}" title="限流 ${pct(rl)}"></i>
      <i class="r-err" style="width:${pct(fail)}" title="失败 ${pct(fail)}"></i>
      <i class="r-idle" style="width:${pct(idle)}" title="其它 ${pct(idle)}"></i>
     </div>
     <div class="s">绿=成功 黄=限流 红=失败 灰=其它（流式中 / 未记账）</div></div>`,
  ].join("");

  // 告警：只有真的有事才说话
  const A = [];
  for (const id of qids) {
    const x = q[id];
    A.push({ t: "err",
      m: `<b>${esc(id)}</b> 被自动隔离（连续 ${x.consecutive_failures} 次 ` +
         `<code>${esc(x.last_error_type || "失败")}</code>），还有 <b>${dur(x.quarantine_seconds_left)}</b> 解除。` +
         `期间没有任何请求会去碰它——这就是省下每次 60 秒超时等待的那道闸。` });
  }
  for (const env of gapIds) {
    A.push({ t: "warn",
      m: `凭据 <b>${esc(gaps[env].join("、"))}</b> 找不到环境变量 <code>${esc(env)}</code>——` +
         `这把 Key 现在调不动，网关会跳过它。去 <code>.env</code> 补上，` +
         `或从控制台「凭据池」改用它已有的变量名。` });
  }
  for (const f of stale) {
    A.push({ t: "warn",
      m: `配置文件 <code>${esc(f)}</code> 被外部改过但网关还没 reload，现在用的是内存里的旧值。` +
         `控制台存一次配置会报 409 并提示先 reload。` });
  }
  if (cw.last_error) {
    A.push({ t: "err", m: `配置监听出错：<code>${esc(cw.last_error)}</code>（改 YAML 不会自动生效）` });
  } else if (cw.enabled) {
    A.push({ t: "warn", m: `配置热监听开着，最近一次 reload 在 ${ago(cw.last_reload_seconds_ago)}。` });
  }
  for (const w of warns.slice(0, 3)) {
    A.push({ t: "warn", m: esc(typeof w === "string" ? w : JSON.stringify(w)) });
  }
  $("alerts").innerHTML = A.slice(0, 6).map(a =>
    `<div class="alert ${a.t}">${a.m}</div>`).join("") ||
    `<div class="alert warn" style="border-left-color:var(--ok);background:var(--ok-soft);color:#14532d">` +
    `没有告警：无隔离部署、无凭据缺口、配置已同步。</div>`;
}

$("go").onclick = loadHistory;
$("days").onchange = loadHistory;

/* 打开页面就跑，不再等用户点「开始体检」。
   实时区 10 秒一刷（只读 /health，很便宜）；历史区只在切换天数时重拉。 */
loadLive();
loadHistory();
setInterval(loadLive, 10000);


function render(stats, reqs, days) {
  const u = stats.usage || {};
  // /admin/requests 的载荷键是 data（object/total/limit/offset/data）。
  // 旧代码读的是 .requests / .items ——两个键都不存在，于是明细表从上线起
  // 就是空的：KPI 有数字、表格说「暂无数据」。改读 data 才有行。
  const list = reqs.data || [];
  // 慢/均值只看成功的：失败请求的 latency 是「多久才发现失败」，混进来会把慢的锅扣给模型。
  const ok = list.filter(r => r.status === 'success');
  const bad = list.filter(r => r.status !== 'success');
  const slow = ok.filter(r => r.latency_ms > 30000).length;
  const verySlow = ok.filter(r => r.latency_ms > 60000).length;
  const avgLat = ok.length ? ok.reduce((s, r) => s + (r.latency_ms || 0), 0) / ok.length : 0;
  const maxLat = ok.reduce((m, r) => Math.max(m, r.latency_ms || 0), 0);

  const byModel = {};
  for (const r of list) {
    const k = r.resolved_model || r.requested_model || '?';
    byModel[k] = byModel[k] || {n: 0, tok: 0, lat: 0, max: 0};
    byModel[k].n++; byModel[k].tok += r.input_tokens || 0;
    byModel[k].lat += r.latency_ms || 0;
    byModel[k].max = Math.max(byModel[k].max, r.latency_ms || 0);
  }
  const maxTok = Math.max(1, ...Object.values(byModel).map(m => m.tok));
  const modelRows = Object.entries(byModel).sort((a, b) => b[1].tok - a[1].tok)
    .map(([m, v]) => `<tr>
      <td>${label(m)}</td><td class="n">${num(v.n)}</td>
      <td class="n">${num(v.tok)}</td>
      <td><div class="bar"><i style="width:${v.tok/maxTok*100}%"></i></div></td>
      <td class="n">${sec(v.lat/v.n)}</td><td class="n">${sec(v.max)}</td>
    </tr>`).join('');

  const slowBig = ok.filter(r => r.latency_ms > 30000 && (r.input_tokens || 0) > 100000).length;
  const slowSmall = ok.filter(r => r.latency_ms > 30000 && (r.input_tokens || 0) <= 100000).length;
  const failCount = bad.length;

  $('out').innerHTML = `
  <div class="kpis">
    <div class="kpis-head">① 这段时间的大脉</div>
    <div class="kpi"><div class="l">请求数（近 ${days} 天）</div><div class="v">${num(u.requests)}</div>
      <div class="s">输入 ${num(u.input_tokens)} tok</div></div>
    <div class="kpi"><div class="l">平均等待</div><div class="v">${sec(avgLat)}</div>
      <div class="s">最长 ${sec(maxLat)}</div></div>
    <div class="kpi ${slow > 0 ? 'is-warn' : 'is-ok'}"><div class="l">等过 30 秒的</div>
      <div class="v">${num(slow)}</div><div class="s">其中 ${num(verySlow)} 次超过 1 分</div></div>
    <div class="kpi"><div class="l">输出/输入 比</div>
      <div class="v">${u.input_tokens ? (u.input_tokens/Math.max(1,u.output_tokens)).toFixed(0) : '—'} : 1</div>
      <div class="s">越高＝越多 token 花在读历史</div></div>
  </div>

  <div class="card">
    <h2>② 谁在干活、慢不慢</h2>
    <table><thead><tr><th>模型</th><th>请求数</th><th>输入 tokens</th>
      <th>占比</th><th>平均等</th><th>最长等</th></tr></thead>
      <tbody>${modelRows || '<tr><td colspan="6" class="muted">暂无数据</td></tr>'}</tbody></table>
    <div class="note">「平均等」是这个模型的真实响应时长。<b>Kimi K3 明显慢，是因为它本来就不是速度杯</b>
      （能力强但 speed 只有 6.0/10）；快的是 GLM / Step / DeepSeek 那几个（9.0+/10）。
      所以「慢」常常不是故障，是它分到了重活。</div>
  </div>

  <div class="card">
    <h2>③ 慢的归因，失败另算</h2>
    <div class="note ${slowBig > slowSmall ? 'warn' : 'ok'}">
      最近 ${num(list.length)} 条里，成功的 ${num(ok.length)} 条：<b>${num(slowBig)} 条</b>又大又慢（超 10 万 token），
      <b>${num(slowSmall)} 条</b>不大但慢。<br>
      ${slowBig > slowSmall
        ? '→ <b>慢的主因是请求体量大</b>：一次要把几十万 token 喂进去，任何模型都快不了。这通常说明会话历史太长了——<b>适时开新会话</b>比什么优化都管用。'
        : '→ 慢的主因不在请求大小，更可能是上游网络或模型排队。这类慢，重启网关没有帮助。'}
      ${failCount ? '<br><br>另有 <b>' + num(failCount) + ' 条失败</b>——失败和慢是两回事，成因（限流 / 隔离 / 无凭据）看上方「此刻在跑」的告警。' : ''}
    </div>
    <div class="hint">逐条明细（含每次尝试的上游错误原文）在<b>控制台「请求记录」页</b>，可按错误类型 / 供应商 / 别名筛，比这里的一屏更细。</div>
  </div>

  <div class="card">
    <h2>④ 为什么派给这个模型（规则说人话）</h2>
    <table><thead><tr><th>如果你要…</th><th>网关会派</th><th>为什么</th></tr></thead><tbody>
      <tr><td>带图片的请求</td><td><b>Kimi K3</b> 或 <b>Step 5</b></td>
        <td>只有这两个「看得见图」（vision 能力 ≥8），其它模型结构上不可能入选</td></tr>
      <tr><td>超大请求（≥10 万 token）</td><td><b>GLM-5.3 / Step 5 / DeepSeek</b></td>
        <td>长上下文；K3 唯一的 1M 窗口已经吃满，机械长读该走空闲的链</td></tr>
      <tr><td>带工具、且上下文 ≥2.4 万 token</td><td><b>GLM-5.3 / Step 5 / DeepSeek</b></td>
        <td>重放几十个工具定义 + 几万历史，只为回一句「跑完了」——不需要旗舰推理</td></tr>
      <tr><td>短问短答、或正经推理</td><td><b>Kimi K3</b></td>
        <td>K3 有「接活标准」：请求本身得是强推理（证明 / 为什么 / 根因）才够格接</td></tr>
      <tr><td>客户端直接写 <span class="mono">zk-k3</span></td><td><b>只用 Kimi K3</b></td>
        <td>你明确指定就听你的，网关不插手</td></tr>
    </tbody></table>
    <div class="note ok">这套规则的用意：<b>强的模型只用来干它擅长的活</b>；
      跑命令、读日志、批量改写这类机械活交给又快又不要钱的模型。
      83% 的 token 走的是免费额度（商汤 / NVIDIA / 魔搭）。</div>
  </div>

  <details><summary>⑤ 我想看更技术的（一次请求的完整决策过程）</summary>
    <div class="card" style="margin-top:10px">
      <p class="hint">在项目目录跑这句，把任意一句话的决策打出来——选了谁、挡了谁、各多少分：</p>
      <pre class="mono">.venv\\Scripts\\python.exe -c "
from app.core.config import get_app_config
from app.models.request import ChatCompletionRequest, ChatMessage
from app.routing.router import Router
q = ChatCompletionRequest(model='zk-auto',
    messages=[ChatMessage(role='user', content='你的问题')])
for c in Router(get_app_config()).plan(q).candidates:
    print(c.model.id, c.provider.id, round(c.score,3),
          'OK' if c.eligible else 'BLOCKED')"
</pre>
      <p class="hint">真实请求的决策原因，控制台「请求记录」每一行的 routing_reason 里也有。</p>
    </div>
  </details>`;
}
</script>
</body>
</html>
