# ZK-AI 外部 CLI 执行体配置模板（可提交；本地现役配置是 config/cli_tools.yaml，gitignore）
#
# 复制到 config/cli_tools.yaml 后按需修改。这个文件是统领大脑的「执行体花名册」：
# 父 agent 派任务时只说角色（如 cli-coder），具体调哪个 CLI、用什么模型、
# 免费还是收费，全部由这里决定——模型看不到也改不了这张表。
#
# 四层防护（从里到外）：
#   1. 本表 enabled 开关：整个工具下线的总闸
#   2. cost_tier 档位：事前定档，审批卡片上会显示给操作者
#   3. 两阶段审批：每次委派先渲染「派给谁、干什么」预览，批准后才执行
#   4. 用量记账 + 日汇总阈值：事后可查可刹住（cli_usage 表，阶段 3 落地）

tools:
  # -------------------------------------------------------------------------
  # Qwen Code —— 本机已装（npm 全局 @qwen-code/qwen-code，命令名是 qwen）
  # 原生支持 OpenAI 兼容后端：--auth-type openai + --openai-base-url +
  # --openai-api-key，可以直接指向本机 zkai 网关。
  # backend: gateway  = 走 zkai 网关（用网关的别名与免费池，计量进网关）
  # backend: official = 走官方 qwen-oauth 登录（用官方免费额度，需先交互登录）
  # ⚠ 命令名是 qwen 不是 qwen-code（cli-entry.js 注册的 bin 名）
  # ⚠ approval_mode 只允许 plan/default：yolo/auto-edit 之类自动同意模式
  #    等于让外部工具绕过 zkai 自己的两阶段审批卡，注册表会硬拦
  # ⚠ base_url 不填时默认 127.0.0.1:8317（Windows 开发机标准端口）；
  #    本服务器网关实际在 8318，现役配置里要显式写上
  # -------------------------------------------------------------------------
  qwen:
    enabled: false                # 端到端验证通过后再打开（见 docs/2026-10-22-cli-probe.md）
    command: qwen
    backend: gateway              # gateway / official
    base_url: http://127.0.0.1:8318/v1   # 本服务器网关端口；Windows 开发机是 8317
    api_key: zk-local             # 本机网关当前不校验，占位即可
    model: zk-auto                # backend=gateway 时填网关别名；official 时填官方模型名
    cost_tier: free               # free / cheap / paid —— 审批卡片上会显示
    timeout: 300                  # 单次委派硬上限（秒，允许 10~1800）
    approval_mode: default        # plan=只分析不动手 / default=写改要它自己再确认

  # -------------------------------------------------------------------------
  # Claude Code —— 未安装，装好后把 enabled 打开
  # 非交互模式：claude -p "任务"（--print）；模型用 --model 指定
  # 收费：走 Anthropic 订阅/API 额度，cost_tier 如实标 paid
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Claude Code（命令名 claude）—— 能力最强的 agent，模型由 CC Switch 决定
  # ⚠ model 留空 = 不传 --model，用它自己配置的模型。**别填网关别名**：
  #    -p 会在客户端校验模型归属，zk-k3 之类直接 unrecognized_model，
  #    请求到不了网关（2026-10-25 实测）。
  # ⚠ approval_mode: bypass -> --dangerously-skip-permissions。它没有无头
  #    可用的只读档，只能开 bypass；只给「用户自己 @」的场景用。
  # ⚠ 前提：CC Switch 在跑（本地代理），否则 claude 连不上。
  # -------------------------------------------------------------------------
  claude:
    enabled: false
    command: claude
    backend: official
    model: ""
    cost_tier: paid
    timeout: 300
    approval_mode: bypass
    models: []
    free_models: []

  # -------------------------------------------------------------------------
  # Codex CLI —— 未安装，装好后把 enabled 打开
  # 非交互模式：codex exec "任务"
  # 可走官方登录，也可配 base_url 指向 zkai 网关（参考 chatgpt_service.py
  # 对 ~/.codex/config.toml 的写法）
  # -------------------------------------------------------------------------
  codex:
    enabled: false
    command: codex
    backend: official
    # 走 ~/.codex/config.toml 里的 provider（可以是本网关的别名）
    model: zk-auto
    cost_tier: paid
    timeout: 300
    approval_mode: plan          # plan -> -s read-only
    # 它自带 ~/.codex/skills，需要本机 skill 的活派给它最省事
    # ⚠ 走网关时网关进程环境里要有 ZKAI_API_TOKEN，否则子进程报缺变量
    models: [zk-auto, deepseek-flash, ds4.1, kimi-k3, glm-5.3]
    free_models: []

  # -------------------------------------------------------------------------
  # CodeBuddy / WorkBuddy（腾讯，@tencent-ai/codebuddy-code）—— 免费档
  # 无头形态：--print + --output-format json（回填会带上游自报 token/成本）
  # --permission-mode 原生有 plan 档，适配器直接透传
  # ⚠ 首次使用要在交互式 codebuddy 里 /login：CLI 登录态与桌面端不共享，
  #    桌面端已登录也会报 Authentication required
  # -------------------------------------------------------------------------
  codebuddy:
    enabled: false
    command: codebuddy
    backend: official            # 用自家订阅额度，不指向网关
    # ⚠ 真实模型清单**不在这个文件里**，也不在任何离线文件里——
    #   `app/services/agent/cli/models.py` 的 `probe_models()` 会**真发请求**
    #   到本机 wb-proxy（`ZKAI_WB_PROXY_URL`，默认 127.0.0.1:8787），
    #   只有产出了内容的模型才算可用。
    #   2026-11-11 三方实测对照（同一个账号）：
    #     `codebuddy --help` 26 个 → 17 个不存在（静态帮助文字）
    #     桌面缓存 65 个 → 只有 35 个是对话模型，26 个 400，4 个是补全/图片
    #     wb-proxy `/v1/models` 14 个 → 8 个调不通，还漏了能用的 hy4free
    #   **没有任何清单可信**，与「/v1/models 是目录不是你能调的」是同一条。
    # 下面是免费 + 便宜的常用档，**仅作实测缓存为空时的离线兜底**。
    # 改这里不会让一个调不通的模型变可用。
    model: hy4free                # ×0.00 免费，960K 上下文，支持工具
    cost_tier: free
    timeout: 300
    approval_mode: plan          # 无头只允许只读分析；写操作必须人工开档
    # 思考强度：满档 max（minimal/low/medium/high/xhigh/max）
    effort: max
    # 上下文：--autocompact 上限 1M（100k~1M），到 1M 才压缩
    context_window: 1000000
    models: [hy4free, hy4flash-exp1, hy3, glm-5.3-flash, minimax-m3.1-flash, deepseek-v4.1-flash, deepseek-v4-flash, fast-model, balanced-model]
    # 兑换率 ×0.00 的（实测确认可用，来自桌面端 credits，2026-11-11）
    free_models: [hy4free, hy4flash-exp1, hy4flash-exp2, hy4flash-exp3, hy4flash-exp4, hy3, hy3-b, hy3-c]

  # -------------------------------------------------------------------------
  # Editor SDK（本机 MCP 服务，免鉴权）—— 2026-11-07 实测
  # 地址：http://127.0.0.1:39099/mcp（另一个实例在 39100；端口每次启动会变）
  # 能力：231 个工具（SHEET 67 / DOC 57 / SLIDE 约 100 / 通用 7），中文工具名
  # ⚠ 这是 MCP，不是子进程：backend: mcp，不要求 command，也不传 model
  # ⚠ mcp_args 里的 {task} 会被任务文本替换；留空表示调用无参数工具
  # -------------------------------------------------------------------------
  editor-sdk:
    enabled: false
    command: ""
    backend: mcp
    mcp_url: http://127.0.0.1:39099/mcp
    mcp_tool: get_pool_status
    mcp_args: {}
    # mcp_call 白名单：模型可以经通用入口直接调这些工具（写类必须人工列在这里）。
    # 正确顺序（2026-11-07 实测全通）：
    #   create_* → **必须再 open_file 一次**（编辑器才真正加载）→ 读写 → save_file → close_file
    # ⚠ open_file 默认只是「开始加载」就返回，紧接着读会报 No workbook open；
    #   mcp_call 会自动补 wait=true。
    # ⚠ 有改动时先 save_file 再 close_file，否则改动会丢（实测不会报错，只会静默丢弃）。
    mcp_tools: [get_pool_status, open_file, save_file, close_file, create_sheet, create_doc, create_slide, sheet_get_sheet_info, sheet_get_cell_data, sheet_set_range_value, doc_insert_markdown, doc_get_outline, slide_add_slide, slide_get_info]
    cost_tier: free
    timeout: 60
    approval_mode: plan
    models: []
    free_models: []

  # -------------------------------------------------------------------------
  # Gemini CLI（@google/gemini-cli）—— 官方免费额度，免费档里最干净的一条
  # 不靠订阅复用、不用逆向：Google AI Studio 的 key 就有免费配额。
  # 无头形态：-p/--prompt + -o json（回填带上游自报 token）
  # ⚠ 跨境访问时网关进程要带 HTTPS_PROXY；适配器会补 NODE_USE_ENV_PROXY=1
  #    （Node 的 fetch 默认不读环境变量里的代理）
  # ⚠ 别用 plan 档做改写：Gemini 的 plan 是「把结果写进 plans/*.md 再回一句
  #    已保存」，正文不进 stdout。机械活要用 default，只读分析才用 plan。
  # -------------------------------------------------------------------------
  gemini:
    enabled: false
    command: gemini
    backend: official
    model: gemini-2.5-flash
    cost_tier: free
    timeout: 300
    approval_mode: default
    models: [gemini-2.5-flash]
    free_models: [gemini-2.5-flash]

  # -------------------------------------------------------------------------
  # Qoder（阿里，@qoder-ai/qodercli 国际版 / @qodercn-ai/qoderclicn 国内版）
  # ⚠ 它的 --permission-mode 没有 plan 档（default/accept_edits/
  #    bypass_permissions/dont_ask/auto），适配器把 plan 映射成 dont_ask：
  #    不弹审批、未预授权一律拒绝——否则无头场景会等审批等到超时
  # ⚠ 先 `qoder login`，再 `qoder --list-models` 核实模型名后打开 enabled
  # -------------------------------------------------------------------------
  qoder:
    enabled: false
    command: qodercli
    backend: official
    # 2026-11-07 实测：Qwen3.8-Flash 已从账号清单消失，live 只剩 `Sonus` 和一条
    # 自定义 `ds (qoder-custom-…)`（后者是显示名、带省略号，不能直接当 --model 传）。
    # 所以默认模型改为 Sonus；清单仍会漂移，**派单前以 live 接口为准**。
    model: Sonus
    cost_tier: free
    timeout: 300
    approval_mode: plan
    # 思考强度映射到 --reasoning-effort（实测接受 max）
    effort: max
    # 上下文窗口映射到 --context-window；**不填时 Qoder 自己按 128K 管理**
    # ⚠ 这是"按多大窗口管理"，不会把模型窗口变大；满档思考实测墙钟翻倍
    context_window: 1000000
    # 2026-11-07 实测 live：Sonus + 一条自定义 ds（带省略号，不能当参数传）。
    # 面板以 live 结果为准；这行只是 CLI 启动失败时的回退快照。
    models: [Sonus]
    free_models: []

# ---------------------------------------------------------------------------
# 角色 -> 执行体映射（父 agent 派单时只看到角色名与能力描述）
# 设计约束（与 app/services/agent/roles.py 内部角色同一套哲学）：
#   模型说「我要个写代码的」，具体给谁由这张表决定，不由模型指定——
#   否则等于让模型绕过成本档位自己挑收费渠道。
# 机械批量活优先指给免费档执行体（codebuddy/qoder），免费档断了再改派。
# ---------------------------------------------------------------------------
roles:
  cli-claude:
    tool: claude                  # 综合能力最强的 agent（模型由 CC Switch 决定）
    hint: 复杂任务、方案与代码评审（外部 CLI 执行）
  cli-grinder:
    tool: codebuddy               # 机械批量活优先免费档
    hint: 机械改写、批量整理（免费档）
  cli-grinder-qoder:
    tool: qoder                   # 第二条免费档，与 codebuddy 互为备份
    hint: 机械改写、批量整理（Qoder 免费档）
  cli-grinder-gem:
    tool: gemini                  # 第三条免费档，官方额度最干净
    hint: 机械改写、批量整理（Gemini 免费档）
  cli-skill:
    tool: codex                   # 需要本机 skill 的活（codex 自带 ~/.codex/skills）
    hint: 需要本机 skill 的任务（外部 CLI 执行）
  cli-office:
    tool: editor-sdk              # 本机 Office 编辑器（MCP，免鉴权）
    # ⚠ 这个角色的固定动作只有「查编辑器池状态」；真正的建表/写文档/做 PPT
    #   走 mcp_call（父模型自己调工具），不要靠 @ 这个角色去干活。
    hint: 查编辑器池状态（改表格/文档请直接描述任务，Agent 会调工具）
