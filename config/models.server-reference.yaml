      reasoning: 7.5
      tool_use: 8.0
      vision: 0.0
      long_context: 8.0
      structured_output: 8.0
      speed: 9.0
      cost: 9.5
    deployments:
      - id: qwen38-modelscope
        provider_id: modelscope
        # 2026-09-29 核对魔搭 /v1/models 后的修正：真实 id 是 `Qwen/Qwen3.8-Flash-Next`
        # （带组织前缀），原来漏了前缀才报 400 "Invalid model id"。实测改后 200 OK。
        enabled: true
        model: Qwen/Qwen3.8-Flash-Next
        priority: 90
        context_window: 256000
        max_output_tokens: 32768
        input_cost_per_mtok: 0.40          # 参考（通义量级）
        output_cost_per_mtok: 1.20         # 参考

  # 2026-09-29 按日日新 Token Plan 官方公告（2026-09-22）修正：
  #   「DeepSeek V4.1 Flash 正式上线，**Model ID：deepseek-flash**」
  # 所以 V4.1 Flash 的正确 id 是 **`deepseek-flash`**，不是 `deepseek-v4.1-flash`。
  # 目录里那个 `deepseek-v4.1-flash` 是**陈旧条目**（403 套餐无权限），别用。
  # 实测：deepseek-flash 200 OK（首次 429 是消耗器抢 tpm，重试即通）。
  #
