# ===========================================================================
# ZK-AI —— 模型 / 部署 / 别名（服务器现役参考版，2026-10-21 拉取自 211.159.174.204）
#
# ⚠ 本文件只是**服务器现役配置的本地存档**，不进路由、不会被加载。
#   运营者已拍板「以服务器现役为准」，本地 config/models.yaml 与服务器不一致时
#   以这份为准去对齐本地；切勿把本地那份当「正确版」scp 回服务器覆盖。
#   服务器现役文件的权威路径：/opt/zkai/config/models.yaml（不进 git）。
# ===========================================================================
# ===========================================================================
# ZK-AI —— 模型 / 部署 / 别名（真实密钥版，后端为商汤 / NVIDIA / ModelScope）
#
# 所有模型 ID 均经 /v1/models 实测确认存在（2026-09-10）。
#
# 四层概念：
#   model       对外暴露的名字，如 sensenova-6.8-flash-lite
#   deployment  「哪个 provider 上的哪个上游模型」= 故障转移最小单位
#   alias       稳定入口，如 zk-fast；换后端模型客户端不用动
#
# capabilities 是能力路由的 0-10 打分：
#   coding / reasoning / tool_use / vision / long_context /
#   structured_output / speed / cost        （cost 越大 = 越便宜）
#
# 字段分层（写错层会直接报 Extra inputs are not permitted）：
#   模型级：context_window、capabilities、description
#   部署级：priority、max_output_tokens、input_cost_per_mtok、options
#
# 价格字段（input_cost_per_mtok / output_cost_per_mtok，美元/百万 token）：
#   用于「等价成本」统计——即使走的是免费公测渠道（商汤/NVIDIA/魔搭），
#   也按模型公开牌价折算出「这趟如果花钱要多少」。付费渠道（如充值后的
#   Kimi 官方）这里就是真实成本。estimate_cost 按命中的那个部署计价。
#   单位是 USD；如习惯看人民币，控制台会同时显示 ≈¥。
#   下面标了 `# 官方` 的来自仓库既有记录（.env.example），标 `# 参考` 的是
#   同量级占位价，**请按各家官方价目表核对后修改**。
# ===========================================================================

models:
  # -------------------------------------------------------------------------
  # 商汤 6.8 Flash Lite —— 当前默认主力
  # 多模态（text + image），速度快、免费，适合日常与看图
  # -------------------------------------------------------------------------
  - id: sensenova-6.8-flash-lite
    enabled: true
    context_window: 256000
    capabilities:
      coding: 7.0
      reasoning: 7.0
      tool_use: 8.0
      vision: 9.0          # 支持图片输入
      long_context: 7.0
      structured_output: 7.5
      speed: 9.5
      cost: 10.0           # 商汤公测期免费
    deployments:
      - id: sen68-sensenova
        provider_id: sensenova
        model: sensenova-6.8-flash-lite    # 上游真实 model id
        priority: 120
        context_window: 256000
        max_output_tokens: 32768
        input_cost_per_mtok: 0.20          # 参考（商汤免费公测）
        output_cost_per_mtok: 0.60         # 参考

  # -------------------------------------------------------------------------
  # Kimi K3 —— 你担心它有问题，所以把它降级、不做主力
  # 但保留为「高难度任务」的备选，双部署：商汤（免费）优先，NVIDIA 兜底
  # NVIDIA 上实测 429（预览期额度极少），故 priority 压到 40
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Kimi K3 —— 主力模型（用户指定）
  # 双部署：商汤（免费，但 K3 走独立的 token 套餐额度）优先，Kimi 官方兜底
  #
  # ⚠ 2026-09-10 实测：两个渠道的 K3 都在 429
  #    商汤  : "token plan entitlement exhausted" = K3 专属套餐额度用尽
  #            （商汤各把 Key 按账号共享额度，同账号的会一起挂）
  #    NVIDIA: "Too Many Requests" = 预览期全局限流，与用量无关
  #   → 别名里的 fallback 链配得很长就是为了扛这个：K3 挂了自动落到
  #     GLM-5.2 / DeepSeek / 6.8 Flash Lite，调用方不会失败
  #   → 想要稳定用 K3：去 platform.moonshot.cn 充点钱，然后在 providers.yaml
  #     重新加回 moonshot 供应商、在下面 kimi-k3 的 deployments 里加回
  #     kimi-k3-moonshot（2026-09-29 已整块删除：无 Key，3,102 次尝试 0 成功，
  #     纯粹是 no_available_credential 噪音）
  # -------------------------------------------------------------------------
  - id: kimi-k3
    enabled: true
    context_window: 1000000
    capabilities:
      coding: 9.5
      reasoning: 9.5
      tool_use: 9.0
      vision: 9.5
      long_context: 10.0
      structured_output: 8.5
      speed: 6.0
      cost: 9.0
    deployments:
      - id: kimi-k3-sensenova
        provider_id: sensenova
        model: kimi-k3
        priority: 130              # 高于其它模型 → 别名里排在前面
        context_window: 1000000
        # 「旗舰的接活标准」2026-09-28 改写：原来是
        #   request_requires: {reasoning: 4.0}
        # 即只有请求文本命中 step-by-step / 证明 / 根因 / 架构权衡 这类**关键词**
        # 才放行。实测这是「分类器总是不可用」的根因：capability.py 的
        # _REASONING_HINTS 匹配不到，请求的 reasoning 权重就停在 zk-auto 别名
        # 地板的 2.0 < 4.0，三个 K3 部署全部 gated_out——于是「你好」、短代码、
        # 工具回执永远落到同一个模型，而显式调 kimi-k3 还会触发
        # 「全部门槛失败、回退无门槛排序」的告警。
        # 关键词是软信号，不能当硬门槛；机械流量现在由形状改写接管
        # （app/routing/agent_auto.py：有工具结果 -> zk-long、超长 -> zk-long、
        #  批量工具 -> zk-long、有图 -> zk-vision），K3 物理上就不在那些链里。
        # 这里留空 = 让能力分说话，K3 的 reasoning 9.5 / coding 9.5 自然会赢下
        # 值得它做的请求。
        request_requires: {}
        # K3 是推理模型：先思考后回答，输出上限要给足
        max_output_tokens: 32768
        input_cost_per_mtok: 2.78          # 官方（¥20/MTok ÷7.2，见 .env.example）
        output_cost_per_mtok: 13.89        # 官方（¥100/MTok ÷7.2）
      - id: kimi-k3-nvidia
        provider_id: nvidia
        model: moonshotai/kimi-k3     # NVIDIA 上必须带厂商前缀
        priority: 40                  # 预览期限流严重，排在最后
        context_window: 1000000
        request_requires: {}     # 见 kimi-k3-sensenova 上的说明（2026-09-28）
        max_output_tokens: 32768
        input_cost_per_mtok: 2.78          # 参考（与官方牌价对齐）
        output_cost_per_mtok: 13.89        # 参考
        # ⛔ 2026-10-15 禁用：NVIDIA 上的 moonshotai/kimi-k3 **已 EOL 下线**。
        #   上游原话：「The model 'moonshotai/kimi-k3' has reached its end of life
        #   on 2026-10-15T08:00:00Z and is no longer available.」(HTTP 410)
        #   ⚠ 410 不是超时，调 timeout 救不了——而且它放在链上时每次请求
        #   都要等一次 NVIDIA 往返（实测 34.7s）才拿到 410，纯浪费墙钟。
        #   K3 现在只剩商汤这一条路（kimi-k3-sensenova）。NVIDIA 若日后重新
        #   上线 K3（换 model id），把 enabled 改回 true。
        #   （分类器/隔离器已同步支持 410：见 app/retry/classifier.py 的
        #    "model_gone" 与 app/routing/scheduler.py 的 is_quarantine_worthy。）
        enabled: false

  # -------------------------------------------------------------------------
  # GLM-5.3 —— 智谱新旗舰（NVIDIA NIM 上新，2026-09-17 实测已可调用）
  # 大杯：能力对标/超越 GLM-5.2，工具调用实测正常
  # 注意：NVIDIA 预览期偶发 ReadTimeout（长上下文更明显），priority 先别太高
  # -------------------------------------------------------------------------
  - id: glm-5.3
    enabled: true
    context_window: 1000000
    capabilities:
      coding: 9.5
      reasoning: 9.0
      tool_use: 8.5
      vision: 0.0
      long_context: 10.0
      structured_output: 8.5
      speed: 6.5
      cost: 9.5           # NVIDIA 预览期免费
    deployments:
      - id: glm53-nvidia
        provider_id: nvidia
        model: z-ai/glm-5.3          # NVIDIA 上必须带厂商前缀
        priority: 100
        context_window: 1000000
        max_output_tokens: 32768
        input_cost_per_mtok: 1.00    # 参考（对齐 GLM-5.2 智谱旗舰档）
        output_cost_per_mtok: 4.00   # 参考

  # -------------------------------------------------------------------------
  # GLM-5.3 Flash —— 5.3 的速度杯，实测首包快、工具调用正常
  # -------------------------------------------------------------------------
  - id: glm-5.3-flash
