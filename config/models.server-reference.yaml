aliases:
  # 默认入口 —— Kimi K3 优先，挂了自动落到 GLM-flash / DeepSeek / Qwen。
  # 注意 targets 的**顺序**就是优先级：K3 排第一。
  # ⚠ glm-5.3 大杯被移出兜底链（2026-09-19）：NVIDIA 预览期 >60s 挂起被
  #   内部重试翻倍成 120s+/次，把 max_total_attempts 预算烧光后 DeepSeek /
  #   Qwen 根本轮不到（实测 agent 任务整条链全灭）。要直连用模型名 glm-5.3。
  - name: zk-auto
    description: 默认入口：接口模型 step-5-preview 先答，其余按能力权重兜底
    strategy: capability
    targets:
      - deepseek-flash
      - DeepSeek-V4.1-Flash-1017
      - kimi-k3
      - glm-5.3
    weights: {coding: 2.0, reasoning: 2.0, speed: 1.0, cost: 1.0}
    # 平时让能力分说话（推理请求才够格 kimi-k3 的 reasoning>=4 门槛，
    # 机械请求自然落到便宜模型）。控制台「🤖 ChatGPT」热切换时代码会
    # 临时置 true 把所选模型钉到链首（app/api/admin.py），与这里无关。
    pin_first: false
    # 接口模型（2026-09-28 新增）：永远排第一、手动指定、随时可改。
    # 背景：glm-5.3 在 NVIDIA 上持续 60s 超时，zk-long 打头时每个长上下文请求
    # 都要白等三轮 60 秒才故障转移，客户端几分钟收不到一个字节。
    # 现在用 step-5-preview 顶上（StepFun 实测稳定），glm-5.3 退到链尾当备用；
    # 后面仍由能力路由按内容排序，接口模型挂掉/超时就自动往下走。
    # 换模型只改这一行，或 POST /admin/aliases 热改，不用重排 targets。
    # 2026-09-29 审查：原为 deepseek-v4.1-flash，但实测该模型返回 503
    # 「model is not available in the current token plan」——套餐里没有它，
    # 63 次尝试 0 成功。接口模型必须是**真能答**的那个，否则每个请求先撞它
    # 一次再往下走。step-5-preview 实测 99.8% 成功率、均 8.6s。
    enabled: true
    requires: {}
    fallback_to_local: false

  # 固定只用 Kimi K3（不兜底，K3 挂了就直接报错，方便你看清它的状态）
    front_model: deepseek-flash
  - name: zk-k3
    description: 只用 Kimi K3（商汤 → NVIDIA，不兜底到别的模型；K3 挂了直接报错）
    strategy: priority
    targets:
      - deepseek-flash
      - DeepSeek-V4.1-Flash-1017
      - kimi-k3
      - glm-5.3
    enabled: true
    requires: {}
    weights: {}
    fallback_to_local: false
    pin_first: false

  # 长会话入口（2026-09-26 新增）
  #  背景：DB 实测 zk-k3 上 2,956 条请求平均 input 228,745 tokens、
  #  output 仅 357（640:1），累计 6.76 亿 input tokens——占全站 9.44 亿的 72%。
  #  根因是 zk-k3 单目标死钉 kimi-k3（最慢档，speed 6.0），长会话无处分流。
  #
  #  ⚠ 设计取舍（调了三轮权重后才想清楚）：**zk-long 故意不含 kimi-k3。**
  #  试过把 K3 和 glm-5.3 放进同一条 capability 链让它俩竞争，结果无论权重怎么调
  #  都是一边倒——K3 在 reasoning/coding/long_context 上全面 ≥ glm-5.3，
  #  线性加权必然让一个恒赢，没有"K3 优先但适度分担"的中间态。
  #  而一旦压低 reasoning 把 glm 拉上来，强推理任务就会离开 K3，那是质量倒退。
  #  所以分流交给客户端按任务性质选，不由网关猜：
  #    - 读多写少、批量、格式转换 → zk-long（快模型，K3 的活不在这）
  #    - 深度推理、复杂代码、看不清的难题 → zk-k3（旗舰，慢但值）
    front_model: deepseek-flash
  - name: zk-long
    description: 长会话/批量：Step 5 与 GLM-5.2、DeepSeek 分担，不含 K3（要 K3 请用 zk-k3）
    strategy: capability
    targets:
      - step-5-preview
      - glm-5.2
      - deepseek-flash
      - deepseek-ai/DeepSeek-V4.1-Flash
    weights: {long_context: 5.0, reasoning: 3.0, speed: 2.0, cost: 2.0}
    # 接口模型：manual override，见 zk-auto 同字段的长注释。
    # glm-5.3 原为 targets[0]，但它在 NVIDIA 上稳定 60s 超时（2026-09-28 实测
    # 连续 3 次），打头等于每个请求先赔 180 秒。改用 step-5-preview 顶，
    # glm-5.3 留在链里当备用——NVIDIA 恢复了它照样能被选中。
    # 2026-09-29 审查：原为 deepseek-v4.1-flash，但实测该模型返回 503
    # 「model is not available in the current token plan」——套餐里没有它，
    # 63 次尝试 0 成功。接口模型必须是**真能答**的那个，否则每个请求先撞它
    # 一次再往下走。step-5-preview 实测 99.8% 成功率、均 8.6s。
    front_model: step-5-preview
    requires: {}
    enabled: true
    fallback_to_local: false
    pin_first: false

  # 看图 / OCR
  - name: zk-vision
    description: 看图/OCR：Kimi K3（原生视觉）→ 6.8 Flash Lite
    strategy: capability
    targets:
      - deepseek-flash
      - kimi-k3
      - step-5-preview
    requires: {vision: 8.0}       # 硬门槛：无视觉能力的模型直接出局
    weights: {vision: 5.0, speed: 1.0}
    enabled: true
    fallback_to_local: false
    pin_first: false
