# ===========================================================================
# ZK-AI - docker compose
#
#   cp .env.example .env      # then fill in the keys you have
#   docker compose up -d --build
#   curl http://127.0.0.1:8317/health
#
# Data (SQLite + WAL) persists in ./data, configuration is mounted read-only.
# ===========================================================================
services:
  zkai:
    build:
      context: .
      dockerfile: Dockerfile
    image: zk-ai:0.1.0
    container_name: zk-ai
    restart: unless-stopped
    ports:
      - "${ZKAI_PORT:-8317}:8317"
    env_file:
      - .env
    environment:
      ZKAI_HOST: 0.0.0.0
      ZKAI_PORT: 8317
      ZKAI_DATA_DIR: /app/data
      ZKAI_CONFIG_DIR: /app/config
      ZKAI_DATABASE_URL: sqlite+aiosqlite:////app/data/zkai.db
      # Reach a local Ollama from inside the container (Linux host gateway):
      # OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8317/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: uncomment to run Ollama alongside the gateway.
